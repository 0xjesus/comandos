<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ComandOS · terminal</title>
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../assets/xterm/xterm.css">
<link rel="stylesheet" href="/buttons.css?v=2">
<!-- Cargamos la fuente bundleada por @font-face para que WebKit la use aun si
     fontconfig del sistema no la conoce. -->
<style>
:root{--sans:'Inter',system-ui,sans-serif;--mono:'Ubuntu Sans Mono','JetBrains Mono',monospace}
  @font-face {
    font-family: var(--mono);
    font-weight: 400; font-style: normal;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Regular.ttf') format('truetype');
  }
  @font-face {
    font-family: var(--mono);
    font-weight: 400; font-style: italic;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Italic.ttf') format('truetype');
  }
  @font-face {
    font-family: var(--mono);
    font-weight: 700; font-style: normal;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Bold.ttf') format('truetype');
  }
  @font-face {
    font-family: var(--mono);
    font-weight: 700; font-style: italic;
    src: url('../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-BoldItalic.ttf') format('truetype');
  }
  :root {
    --term-bg:#0A0D13; --term-panel:#121722; --term-panel2:#161C29;
    --term-line:#222A3A; --term-line2:#2E3852; --term-text:#EAF0FB;
    --term-dim:#9AA6BF; --term-faint:#5E6980; --term-brand:#8B7CFF;
  }
  html, body { margin: 0; padding: 0; width: 100%; max-width: 100%; height: 100%; background:var(--term-bg); color:var(--term-text); overflow: hidden; }
  #term-shell { width: 100%; max-width: 100%; min-width: 0; height: 100%; display: grid;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; position:relative;
    overflow: hidden; background:var(--term-bg); }
  #term {
    /* content-box: FitAddon mide la altura del contenedor y solo descuenta el padding del
       elemento de xterm; con border-box contaba nuestro padding como renglones y las
       últimas líneas (el prompt) quedaban tapadas por la barra táctil. */
    width: auto; max-width: none;
    padding: 22px 6px 6px 10px;   /* 8 + 14 px: la cabecera de los panes de arriba crece hacia aquí (igual que el escritorio) */
    box-sizing: content-box;
    min-width: 0; min-height: 0;
    overflow: hidden;
  }
  #term-toolbar { box-sizing: border-box; display: flex; gap: 6px;
    width: 100%; max-width: 100%; min-width: 0; overflow-x: auto;
    padding: 6px; border-top: 1px solid var(--term-line2); background:var(--term-panel);
    overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
  #term-toolbar button { box-sizing: border-box; flex: 0 0 auto; min-width: 44px; height: 44px; padding: 0 10px;
    border: 1px solid var(--term-line2); border-radius: 4px; background:var(--term-panel2); color:var(--term-text);
    font: 700 13px var(--mono); }
  #term-toolbar button.key-hot { min-width: 64px; font-weight: 700; border-color:var(--term-brand); }
  /* Respuesta rápida a los agentes: Sí (Enter) verde, No (Esc) rojo. */
  #term-toolbar button.key-yes, #term-toolbar button.key-no { min-width: 56px; font-weight: 800; }
  #term-toolbar button.key-yes { color:#4ade80; border-color:#1f7a44; }
  #term-toolbar button.key-no { color:#f87171; border-color:#8a2a35; }
  #term-toolbar button.on { background:var(--term-brand); border-color:var(--term-brand); color:var(--term-bg); }
  [hidden] { display:none !important; }
  #term-toolbar button:disabled { opacity: .55; }
  #selection-toolbar { grid-row:2 / 4; padding:6px; border-top:1px solid var(--term-line2); background:var(--term-panel); }
  .selection-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
  @media (max-width:600px) { .selection-row { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  #selection-toolbar button.primary { background:var(--term-brand); border-color:var(--term-brand); color:var(--term-bg); }
  #selection-toolbar button { min-width:0; min-height:44px; border:1px solid var(--term-line2);
    border-radius:4px; background:var(--term-panel2); color:var(--term-text); font:600 14px var(--sans); touch-action:manipulation; }
  #selection-toolbar button:disabled { opacity:.5; }
  #pane-dialog { box-sizing:border-box; width:min(460px,calc(100vw - 20px)); max-height:80dvh; overflow:auto;
    border:1px solid var(--term-line2); border-radius:10px; padding:14px; color:var(--term-text); background:var(--term-panel); }
  #pane-dialog::backdrop { background:#0009; }
  #pane-dialog h2 { margin:0 0 10px; font:600 18px var(--sans); }
  #pane-dialog button { min-height:44px; border:1px solid var(--term-line2); border-radius:4px;
    padding:8px 12px; background:var(--term-panel2); color:var(--term-text); font:14px var(--sans); touch-action:manipulation; }
  #pane-dialog button:disabled { opacity:.5; }
  #pane-list { display:grid; gap:8px; margin:10px 0; }
  .pane-option { display:flex; flex-wrap:wrap; gap:8px; min-width:0; padding-bottom:8px; border-bottom:1px solid var(--term-line2); }
  .pane-option > button:first-child { flex:1 1 100%; min-width:0; overflow-wrap:anywhere; text-align:left; }
  .pane-option > button:not(:first-child) { flex:1 1 0; min-width:0; }
  .pane-option .pane-path { display:block; margin-top:2px; font:13px/1.3 var(--mono); color:var(--term-dim); overflow-wrap:anywhere; }
  .pane-option [aria-pressed="true"] { border-color:var(--term-brand)!important; }
  #pane-dialog .danger { color:#ff9b9b; border-color:#a64c55; }
  #pane-dialog p { font:14px/1.4 var(--sans); }
  #pane-dialog footer { display:flex; gap:8px; justify-content:flex-end; }
  #term-toolbar svg { width: 20px; height: 20px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  #paste-dialog { width: min(420px, calc(100vw - 32px)); color:var(--term-text); background:var(--term-panel);
    border: 1px solid var(--term-line2); border-radius: 6px; padding: 14px; }
  #paste-dialog::backdrop { background: rgba(0, 0, 0, .55); }
  #paste-dialog form { display: grid; gap: 10px; }
  #paste-text { min-height: 132px; box-sizing: border-box; resize: vertical; color: inherit;
    background:var(--term-bg); border: 1px solid var(--term-line2); font: 13px var(--mono); }
  #paste-dialog form > div { display: flex; justify-content: flex-end; gap: 8px; }
  #paste-dialog button { background:var(--term-panel2); border:1px solid var(--term-line2); color:var(--term-text);
    border-radius:4px; padding:6px 10px; font:inherit; }
  #paste-dialog button:hover { border-color:var(--term-brand); }
  /* Remoto: la barra de teclas y el borrador los dibuja la página padre (una sola barra en chat y terminal). */
  html.docked #term-toolbar, html.docked #mobile-compose { display:none !important; }
  #mobile-compose { display:flex; gap:6px; padding:6px; border-top:1px solid var(--term-line2); background:var(--term-panel); min-width:0; }
  #mobile-draft { flex:1; min-width:0; resize:none; max-height:25dvh; box-sizing:border-box; padding:8px;
    border:1px solid var(--term-line2); border-radius:4px; background:var(--term-bg); color:var(--term-text);
    font:16px/1.35 var(--mono); touch-action:pan-y; }
  #mobile-compose button, #terminal-history button, #history-pane { min-height:44px; border:1px solid var(--term-line2);
    border-radius:4px; color:var(--term-text); background:var(--term-panel2); font:inherit; padding:6px 10px; }
  #mobile-compose button:disabled { opacity:.5; }
  #mobile-compose button { min-width:44px; font:600 13px/1.2 var(--sans); }
  #terminal-history { position:absolute; inset:0 0 112px; z-index:5; display:flex; flex-direction:column;
    min-height:0; background:var(--term-bg); padding:8px; box-sizing:border-box; }
  #history-controls { display:flex; flex-wrap:wrap; gap:6px; align-items:center; flex:none; font:13px var(--sans); }
  #history-pane { flex:1; min-width:90px; max-width:100%; }
  #history-status { font:13px/1.3 var(--sans); color:var(--term-dim); margin:6px 0; flex:none; }
  #history-text { margin:0; padding:10px; flex:1; min-height:0; overflow:auto; white-space:pre-wrap;
    overflow-wrap:anywhere; width:100%; box-sizing:border-box; resize:none; border:1px solid var(--term-line2);
    border-radius:4px; color:var(--term-text); background:var(--term-bg); font:16px/1.45 var(--mono); user-select:text; -webkit-user-select:text;
    touch-action:manipulation; -webkit-touch-callout:default; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  #history-text::selection { background:var(--term-brand); color:var(--term-bg); }
  #term-toolbar button,#history-controls button { touch-action:manipulation; }
  @media(pointer:coarse){
    /* Editable controls below 16px trigger automatic focus zoom on iOS. */
    #history-pane,#paste-text,.xterm .xterm-helper-textarea { font-size:16px!important; }
    #pane-dialog { margin:auto auto max(10px,env(safe-area-inset-bottom)); }
  }
  #err {
    position: absolute; inset: 0; display: none;
    color:var(--term-brand); font-family: var(--mono);
    padding: 16px; white-space: pre-wrap; pointer-events:none;
  }
  #dbg {
    position: fixed; right: 8px; top: 8px; z-index: 9; display: none;
    color:var(--term-brand); font-family: var(--mono);
    font-size: 11px; background:var(--term-panel); padding: 4px 8px;
    border-radius: 4px; max-width: 60vw; white-space: pre-wrap;
  }
  #dbg.on { display: block; }
  *{scrollbar-width:thin;scrollbar-color:var(--term-line2) var(--term-bg)}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:var(--term-bg)}
  *::-webkit-scrollbar-thumb{background:var(--term-line2);border-radius:10px;border:3px solid var(--term-bg);background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--term-brand);background-clip:padding-box}

  /* Marcos y cabecera B por pane (grill 30-sep), mismas medidas que el escritorio. */
  #pane-chrome { position:absolute; inset:0; pointer-events:none; z-index:3; }
  #pane-chrome .pc-frame { position:absolute; box-sizing:border-box; border:1px solid var(--term-line2); border-radius:10px; }
  #pane-chrome .pc-frame.on { border-color:var(--term-brand, #8b7cf6); }
  /* Agarradera de resize entre panes: línea fina a todo lo largo + pastilla central con puntos. */
  #pane-chrome .pc-grip { position:absolute; }
  #pane-chrome .pc-grip .ln { position:absolute; background:var(--term-brand, #8b7cf6); opacity:.55; }
  #pane-chrome .pc-grip.drag .ln { opacity:1; }
  #pane-chrome .pc-grip.v .ln { left:50%; top:0; bottom:0; width:2px; margin-left:-1px; }
  #pane-chrome .pc-grip.h .ln { top:50%; left:0; right:0; height:2px; margin-top:-1px; }
  #pane-chrome .pc-grip .pill { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:4px;
    background:var(--term-brand, #8b7cf6); box-shadow:0 1px 3px #0008; transition:width .12s, height .12s; }
  #pane-chrome .pc-grip.v .pill { width:6px; height:34px; }
  #pane-chrome .pc-grip.h .pill { width:34px; height:6px; }
  #pane-chrome .pc-grip.v.drag .pill { width:8px; height:44px; }
  #pane-chrome .pc-grip.h.drag .pill { width:44px; height:8px; }
  #pane-chrome .pc-grip .pill::after { content:""; position:absolute; inset:0; margin:auto; opacity:.9; }
  #pane-chrome .pc-grip .tip { position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; font:700 11px var(--mono);
    background:var(--term-brand, #8b7cf6); color:var(--term-bg); padding:2px 8px; border-radius:5px; box-shadow:0 1px 3px rgba(0,0,0,.35); }
  #pane-chrome .pc-grip.v .tip { top:calc(50% - 44px); }
  #pane-chrome .pc-grip.h .tip { top:-26px; }
  #pane-chrome .pc-grip.v .pill::after { width:3px; height:17px; background:radial-gradient(circle, #fff 1.3px, transparent 1.5px) 0 0/3px 7px repeat-y; }
  #pane-chrome .pc-grip.h .pill::after { width:17px; height:3px; background:radial-gradient(circle, #fff 1.3px, transparent 1.5px) 0 0/7px 3px repeat-x; }
  /* Manita (1-oct): agarrar al pasar por el canal, agarrando mientras se arrastra. */
  #term:is(.resize-col,.resize-row) .xterm-screen, #term:is(.resize-col,.resize-row) .xterm-screen * { cursor:grab !important; }
  #term.grabbing .xterm-screen, #term.grabbing .xterm-screen * { cursor:grabbing !important; }
  /* Phone showing one pane of a split (crop.rs): the pane alone, edge to edge, no frames. */
  html.cropped #term { padding: 2px 0 0 2px; }
  html.cropped #pane-chrome { display:none; }
  #pane-chrome .pc-head { position:absolute; box-sizing:border-box; display:flex; align-items:center; gap:8px; padding:0 10px;
    border-radius:9px 9px 0 0; background:color-mix(in srgb, var(--term-panel) 65%, var(--term-line2)); font:11px var(--sans); color:var(--term-text); }
  #pane-chrome .pc-head b { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30%; }
  #pane-chrome .pc-sep { width:1px; height:14px; background:var(--term-line2); flex:none; }
  #pane-chrome .pc-logo { width:14px; height:14px; border-radius:4px; color:#fff; font:800 9px/14px var(--sans); text-align:center; flex:none; }
  #pane-chrome .pc-model { font:600 11px var(--mono); white-space:nowrap; }
  #pane-chrome .pc-eff { color:var(--term-dim, #8a98ab); }
  #pane-chrome .pc-ok { color:#4ade80; font-weight:800; }
  #pane-chrome .pc-keys { margin-left:auto; display:flex; gap:10px; flex:none; }
  #pane-chrome .pc-keys button { pointer-events:auto; height:22px; min-width:0; padding:0 14px; display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--term-line2); border-radius:8px; background:var(--term-panel2); color:var(--term-dim, #8a98ab);
    font:600 11px var(--sans); cursor:pointer; box-shadow:0 2px 0 var(--term-line2); }
  #pane-chrome .pc-keys button:hover { color:var(--term-text); }
  #pane-chrome .pc-keys button:active { transform:translateY(2px); box-shadow:none; }
  #pane-chrome .pc-keys button[data-act="acct"] b { color:var(--term-text); font-weight:700; }
  /* Menú «Cuenta» (grill 2-oct): cada cuenta con 5 h, semana y semana por modelo. */
  #pane-chrome .pc-acct { position:absolute; z-index:6; width:300px; max-width:calc(100% - 16px); box-sizing:border-box; pointer-events:auto;
    background:var(--term-panel); border:1px solid var(--term-line2); border-radius:12px; box-shadow:0 14px 40px rgba(0,0,0,.55); padding:8px; font:13px var(--sans); color:var(--term-text); }
  #pane-chrome .pc-acct h4 { margin:2px 6px 8px; font:700 10px var(--mono); letter-spacing:.12em; color:var(--term-dim); }
  #pane-chrome .pc-acct .acc { display:grid; grid-template-columns:1fr auto; gap:4px 10px; width:100%; text-align:left; padding:9px 10px; border-radius:9px;
    border:1px solid transparent; background:none; color:var(--term-text); cursor:pointer; font:13px var(--sans); }
  #pane-chrome .pc-acct .acc:hover:not(:disabled) { background:var(--term-panel2); }
  #pane-chrome .pc-acct .acc.on { border-color:color-mix(in srgb, var(--term-brand) 50%, transparent); cursor:default; }
  #pane-chrome .pc-acct .acc:disabled:not(.on) { opacity:.5; cursor:not-allowed; }
  #pane-chrome .pc-acct .acc .tag { font:600 10px var(--mono); color:var(--term-brand); align-self:center; }
  #pane-chrome .pc-acct .bars { grid-column:1 / -1; display:grid; grid-template-columns:auto 1fr auto; gap:3px 8px; align-items:center; font:11px var(--mono); color:var(--term-dim); }
  #pane-chrome .pc-acct .bar { height:5px; border-radius:3px; background:var(--term-line); overflow:hidden; }
  #pane-chrome .pc-acct .bar i { display:block; height:100%; background:var(--term-brand); }
  #pane-chrome .pc-acct .bar i.warn { background:#fbbf24; }
  #pane-chrome .pc-acct .bar i.full { background:#f87171; }
  #pane-chrome .pc-acct .foot { margin:8px 6px 2px; font-size:12px; color:var(--term-dim); }
  #pane-chrome .pc-acct .msg { margin:8px 6px 2px; font-size:12px; color:var(--term-text); }
  #pane-chrome .pc-acct .msg.err { color:#f87171; }
  #pane-chrome .ai-dot { display:block; flex:none; position:relative; }
  #pane-chrome .ai-dot::before { content:""; position:absolute; inset:calc(50% - 4px); width:8px; height:8px; border-radius:50%; background:var(--ai-c); }
  #pane-chrome .ai-dot.ai-need::before { animation:pc-pulse 1.4s ease-in-out infinite; }
  @keyframes pc-pulse { 50% { box-shadow:0 0 0 4px color-mix(in srgb, var(--ai-c) 30%, transparent); } }
  @media (prefers-reduced-motion:reduce) { #pane-chrome .ai-dot::before { animation:none; } }
  @media (max-width:420px) { #pane-chrome .pc-eff, #pane-chrome .pc-keys button span { display:none; } #pane-chrome .pc-keys button { padding:0 9px; } }
</style>
</head>
<body>
<div id="term-shell">
  <div id="term"></div>
  <div id="pane-chrome"></div>
  <div id="term-toolbar" role="toolbar" aria-label="Controles de terminal" hidden>
    <button type="button" data-key="escape" class="key-hot">Esc</button>
    <button type="button" data-key="ctrlc" class="key-hot" title="Interrumpir (Ctrl+C)" aria-label="Enviar Ctrl+C">Ctrl+C</button>
    <button type="button" data-key="yes" class="key-yes" title="Sí: confirma la opción resaltada del agente (Enter)" aria-label="Responder sí (Enter)">Sí</button>
    <button type="button" data-key="no" class="key-no" title="No: rechaza la pregunta del agente (Esc)" aria-label="Responder no (Esc)">No</button>
    <button type="button" data-action="mode" aria-pressed="false">Seleccionar</button>
    <button type="button" data-action="panes">Paneles</button>
    <button type="button" data-key="backspace" title="Borrar un carácter en la terminal (Backspace)" aria-label="Borrar un carácter en la terminal">⌫</button>
    <button type="button" data-action="history" aria-pressed="false">Historial</button>
    <button type="button" data-action="copy">Copiar</button>
    <button type="button" data-action="paste">Pegar</button>
    <button type="button" data-action="keyboard" aria-pressed="false" title="Alternar borrador móvil y teclado directo">Teclado directo</button>
    <button type="button" data-action="ctrl" aria-pressed="false">Ctrl</button>
    <button type="button" data-key="tab">Tab</button>
    <button type="button" data-key="left" aria-label="Izquierda" title="Izquierda"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" data-key="up" aria-label="Arriba" title="Arriba"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
    <button type="button" data-key="down" aria-label="Abajo" title="Abajo"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <button type="button" data-key="right" aria-label="Derecha" title="Derecha"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>

  </div>
  <form id="mobile-compose" hidden aria-label="Escribir en la terminal">
    <textarea id="mobile-draft" rows="2" aria-label="Borrador para la terminal" placeholder="Escribe aquí…" autocapitalize="off" spellcheck="false"></textarea>
    <button type="button" id="draft-insert" title="Insertar texto sin Enter">Insertar</button>
    <button type="submit" id="draft-send" title="Enviar texto y Enter">Enviar ↵</button>
  </form>
  <div id="selection-toolbar" role="toolbar" aria-label="Seleccionar y copiar texto" hidden>
    <div class="selection-row">
      <button type="button" id="selection-close">← Volver a la terminal</button>
      <button type="button" id="selection-copy" class="primary">Copiar selección</button>
      <button type="button" id="selection-all">Copiar todo</button>
      <button type="button" data-selection-line="up" aria-label="Agregar la línea de arriba a la selección">+ Línea arriba</button>
      <button type="button" data-selection-line="down" aria-label="Agregar la línea de abajo a la selección">+ Línea abajo</button>
    </div>
  </div>
  <section id="terminal-history" hidden aria-label="Historial seleccionable">
    <div id="history-controls">
      <select id="history-pane" aria-label="Panel del historial"></select>
      <button type="button" id="history-refresh">Actualizar</button>
      <button type="button" id="history-bottom">Final</button>
    </div>
    <p id="history-status" role="status"></p>
    <textarea id="history-text" readonly wrap="soft" inputmode="none" spellcheck="false" aria-label="Texto del panel. Toca una línea para seleccionarla y otra para extender, o ajusta Inicio y Fin con las flechas de abajo."></textarea>
  </section>
</div>
<div id="err"></div>
<div id="dbg">iniciando…</div>
<dialog id="paste-dialog">
  <form method="dialog">
    <textarea id="paste-text" aria-label="Texto para pegar"></textarea>
    <div><button value="cancel">Cancelar</button><button id="paste-submit" value="default">Pegar</button></div>
  </form>
</dialog>
<dialog id="pane-dialog" aria-labelledby="pane-dialog-title">
  <h2 id="pane-dialog-title">Paneles de esta sesión</h2>
  <p id="pane-status" role="status"></p>
  <div id="pane-list"></div>
  <div id="pane-confirm" hidden>
    <p id="pane-confirm-label"></p>
    <p>Se cerrará el proceso de este panel.</p>
    <footer><button type="button" id="pane-cancel">Cancelar</button><button type="button" id="pane-close-confirm" class="danger">Cerrar split</button></footer>

<script>
(function () {
  const params = new URLSearchParams(location.search);

  const theme  = (params.get('theme') || 'noche').toLowerCase();
  const BUTTON_STYLES = ['sutil', 'arcade', 'tecla', 'pixel', 'consola'];
  function applyButtonStyle(style) {
    if (!BUTTON_STYLES.includes(style)) return false;

  }

  // ttyd toma la sesión del querystring del WS (por --url-arg).
  // Remoto (servida por ttyd bajo /term via tailscale): ws same-origin
  // wss://host/term/ws. La app pasa ?ws= explicito (file:// no tiene origen).
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const basePath = location.pathname.replace(/\/[^/]*$/, '');
  const wsBase = params.get('ws')
    || (location.host ? `${proto}://${location.host}${basePath}/ws`

  const ws_url = ttydWebSocketUrl(wsBase, accessTokenParam, arg);

  const THEMES = {
    noche:  {background:'#0A0D13',foreground:'#EAF0FB',cursor:'#FFAE1A',cursorAccent:'#0A0D13',selectionBackground:'#2E3852',panel:'#121722',panel2:'#161C29',line:'#222A3A',line2:'#2E3852',dim:'#9AA6BF',faint:'#5E6980',brand:'#8B7CFF'},
    dia:    {background:'#BCC7D4',foreground:'#17202B',cursor:'#1D55C7',cursorAccent:'#FFFFFF',selectionBackground:'#98A6B6',panel:'#F1F4F7',panel2:'#DDE4EB',line:'#98A6B6',line2:'#687A90',dim:'#3E4D61',faint:'#5E7087',brand:'#1D55C7'},
    calido: {background:'#161009',foreground:'#F2E5D0',cursor:'#FFB454',cursorAccent:'#161009',selectionBackground:'#36291A',panel:'#1F1811',panel2:'#261D14',line:'#36291A',line2:'#4A3823',dim:'#BCA98C',faint:'#8A7A5F',brand:'#E0A458'},
    termius:{background:'#0E1620',foreground:'#D6E0EA',cursor:'#FFAE1A',cursorAccent:'#0E1620',selectionBackground:'#25384F',panel:'#141E2A',panel2:'#182432',line:'#1C2733',line2:'#25384F',dim:'#8FA0B4',faint:'#5C6B80',brand:'#4CE07A'},
    bruno:  {background:'#1A1A1A',foreground:'#CCCCCC',cursor:'#E4AE49',cursorAccent:'#1A1A1A',selectionBackground:'#444444',panel:'#222224',panel2:'#26292B',line:'#333333',line2:'#444444',dim:'#AAAAAA',faint:'#999999',brand:'#E4AE49',black:'#888888',red:'#DA462F',green:'#73E89A',yellow:'#FAD075',blue:'#8BC2F9',magenta:'#D691ED',cyan:'#7DDFF2',white:'#CCCCCC',brightBlack:'#666666',brightRed:'#F38172',brightGreen:'#73E89A',brightYellow:'#FAD075',brightBlue:'#8BC2F9',brightMagenta:'#D691ED',brightCyan:'#7DDFF2',brightWhite:'#FFFFFF'},
    superglass:{background:'#080B19',foreground:'#F2F5FF',cursor:'#72E6FF',cursorAccent:'#061119',selectionBackground:'#34416C',panel:'#171B36',panel2:'#202749',line:'#34416C',line2:'#53679A',dim:'#B7C3E8',faint:'#8291BD',brand:'#72E6FF'},
    neon:   {background:'#07080D',foreground:'#F7F7FC',cursor:'#28E7F2',cursorAccent:'#041214',selectionBackground:'#33384B',panel:'#11131B',panel2:'#181B27',line:'#33384B',line2:'#596079',dim:'#B7B8CA',faint:'#85879F',brand:'#28E7F2'},
    contraste:{background:'#000000',foreground:'#FFFFFF',cursor:'#59B0FF',cursorAccent:'#000000',selectionBackground:'#8A8A8A',panel:'#0B0B0B',panel2:'#171717',line:'#8A8A8A',line2:'#FFFFFF',dim:'#E0E0E0',faint:'#B8B8B8',brand:'#59B0FF'},
    ubuntu: {background:'#300A24',foreground:'#FFFFFF',cursor:'#FFFFFF',cursorAccent:'#300A24',selectionBackground:'#7A4069',panel:'#3C1531',panel2:'#48193C',line:'#5C2A4F',line2:'#7A4069',dim:'#E8DCE4',faint:'#BBA5B5',brand:'#E95420',black:'#2E3436',red:'#CC0000',green:'#4E9A06',yellow:'#C4A000',blue:'#3465A4',magenta:'#75507B',cyan:'#06989A',white:'#D3D7CF',brightBlack:'#555753',brightRed:'#EF2929',brightGreen:'#8AE234',brightYellow:'#FCE94F',brightBlue:'#729FCF',brightMagenta:'#AD7FA8',brightCyan:'#34E2E2',brightWhite:'#EEEEEC'},
  };
  let activeTheme = THEMES[theme] ? theme : 'noche';

  const showErr = (msg) => {
    const e = document.getElementById('err');
    e.textContent = msg;
    e.style.display = 'block';
  };
  const hideErr = () => {
    const e = document.getElementById('err');
    e.textContent = '';
    e.style.display = 'none';
  };

  function openWebLink(_event, url) {
    const link = document.createElement('a');
    link.href = url;

  }

  const term = new Terminal({
    fontFamily: "'Ubuntu Sans Mono', 'JetBrainsMono Nerd Font Mono', 'JetBrainsMono Nerd Font', 'JetBrains Mono', 'DejaVu Sans Mono', monospace",
    fontSize: 14,
    lineHeight: 1.2,      // mismo interlineado que el escritorio (TERM_LINE_SCALE en cc-app)
    letterSpacing: 0,
    cursorBlink: true,
    cursorStyle: 'block',
    scrollback: 10000,
    allowProposedApi: true,   // requerido por CanvasAddon para exponer ligas

  });

  const fit    = new FitAddon.FitAddon();
  const links  = new WebLinksAddon.WebLinksAddon(openWebLink);
  const canvas = new CanvasAddon.CanvasAddon();
  term.loadAddon(fit);
  term.loadAddon(links);
  term.open(document.getElementById('term'));
  window.__comandosTerm = term;
  // URLs ENVUELTAS por el wrap duro de tmux: WebLinksAddon solo ve una fila;
  // este provider re-une el bloque de filas llenas y liga el span completo.
  // Un link jamas debe romperse por saltos de linea.
  try{ term.registerLinkProvider && term.registerLinkProvider({
    provideLinks(row, cb){
      try{
        const buf = term.buffer.active;
        const y = row - 1;
        const lineTxt = i => { const l = buf.getLine(i); return l ? l.translateToString(true) : ""; };
        const full = i => lineTxt(i).length >= term.cols;   // fila llena => wrap duro probable
        let top = y, bot = y;
        while (top > 0 && full(top - 1)) top--;
        while (bot < buf.length - 1 && full(bot)) bot++;
        if (top === bot){ cb(undefined); return; }          // una sola fila: la cubre WebLinksAddon
        const rows = []; let joined = "";
        for (let i = top; i <= bot; i++){ rows.push({i, off: joined.length, len: lineTxt(i).length}); joined += lineTxt(i); }
        const found = [];
        const re = /https?:\/\/[^\s'"<>\])]+/g; let m;
        while ((m = re.exec(joined))){
          // El punto o la coma que cierran la oración no son parte del link.
          const text = m[0].replace(/[.,;:!?]+$/, '');
          const s = m.index, e = m.index + text.length;
          const sr = rows.filter(r => r.off <= s).pop(), er = rows.filter(r => r.off < e).pop();
          if (!sr || !er || sr.i === er.i) continue;         // solo spans multi-fila
          if (y < sr.i || y > er.i) continue;                // debe tocar la fila pedida
          found.push({
            text,
            range: {start: {x: s - sr.off + 1, y: sr.i + 1}, end: {x: e - er.off, y: er.i + 1}},
            activate: (_e, text) => openWebLink(_e, text),
          });
        }
        cb(found.length ? found : undefined);
      }catch(e){ cb(undefined); }
    }
  }); }catch(_e){}
  // Canvas addon debe cargarse DESPUES de open() y antes de escribir.

  // Ligaduras via opentype.js overlay (browser puro) — SOLO desktop: en

  const toolbar = document.getElementById('term-toolbar');

    const liga = new LigaturesWebAddon({
      fontUrl: '../assets/fonts/JetBrainsMono/JetBrainsMonoNerdFontMono-Regular.ttf',
      fontSize: 14,
      foreground: cfg.foreground,
      background: cfg.background,

    });

      term.loadAddon(liga);

    root.setProperty('--term-panel', cfg.panel);
    root.setProperty('--term-panel2', cfg.panel2);
    root.setProperty('--term-line', cfg.line);
    root.setProperty('--term-line2', cfg.line2);
    root.setProperty('--term-text', cfg.foreground);
    root.setProperty('--term-dim', cfg.dim);
    root.setProperty('--term-faint', cfg.faint);
    root.setProperty('--term-brand', cfg.brand);

    document.getElementById('term-shell').style.background = cfg.background;
    if (changed) refreshLigatures(cfg);

  }

    if (event.origin !== location.origin || event.source !== parent ||

    if (data.type === 'button-style') return applyButtonStyle(data.style);
    if (data.type === 'theme') {

      return applyTerminalTheme(data.theme);

    if (data.type === 'interaction-state') {

      const t = data.term || {};
      if (t.type === 'toolbar' && TOOLBAR_KEYS[t.key]) { sendToolbarKey(t.key); return true; }
      if (t.type === 'paste' && typeof t.text === 'string') { pasteTerminalText(t.text); focusTerminal(); return true; }

  let fitFrame = 0;
  let heightFitTimer = 0;
  let columnReloadTimer = 0;
  let fitDeferredForSelection = false;
  let resizeDisposed = false;

    try {
      const ownerFrame = typeof window !== 'undefined' ? window.frameElement : null;
      if (ownerFrame && typeof ownerFrame.getClientRects === 'function' &&

      if (typeof document === 'undefined') return true;

      if (!surface || typeof surface.getBoundingClientRect !== 'function') return true;
      const rect = surface.getBoundingClientRect();
      return rect.width > 0 && rect.height > 0;
    } catch (_) {
      return true;

    if (heightFitTimer) clearTimeout(heightFitTimer);

    columnReloadTimer = 0;
    if (resizeDisposed || !terminalSurfaceVisible()) return;
    if (term.hasSelection()) {
      fitDeferredForSelection = true;
      return;
    }
    try {
      const finalSize = fit.proposeDimensions();
      if (!finalSize) return;
      if (finalSize.cols === term.cols) {
        if (finalSize.rows !== term.rows) fit.fit();
        return;
      }
      fit.fit();
      restartWebSocketForResize();

    heightFitTimer = 0;
    if (resizeDisposed || !terminalSurfaceVisible()) return;

      const finalSize = fit.proposeDimensions();
      if (!finalSize) return;
      if (finalSize.cols !== term.cols) {
        scheduleFit();
        return;
      }
      if (finalSize.rows !== term.rows) fit.fit();
    } catch (_) {
      heightFitTimer = 0;
    }
  }

  function coordinateResize() {
    fitFrame = 0;
    if (resizeDisposed) return;
    if (!terminalSurfaceVisible()) {
      clearResizeTimers();
      return;
    }
    try {
      const next = fit.proposeDimensions();
      if (!next) return;
      if (next.cols === term.cols && next.rows === term.rows) {
        if (heightFitTimer) clearTimeout(heightFitTimer);
        if (columnReloadTimer) clearTimeout(columnReloadTimer);
        heightFitTimer = columnReloadTimer = 0;
        return;
      }
      if (next.cols !== term.cols) {
        if (heightFitTimer) clearTimeout(heightFitTimer);
        heightFitTimer = 0;
        if (term.hasSelection()) {
          fitDeferredForSelection = true;
          if (columnReloadTimer) clearTimeout(columnReloadTimer);
          columnReloadTimer = 0;
          return;
        }
        fitDeferredForSelection = false;
        if (columnReloadTimer) clearTimeout(columnReloadTimer);
        columnReloadTimer = setTimeout(commitColumnReload, 180);
        return;
      }
      if (columnReloadTimer) clearTimeout(columnReloadTimer);
      columnReloadTimer = 0;
      if (heightFitTimer) clearTimeout(heightFitTimer);
      heightFitTimer = setTimeout(commitHeightFit, 120);
    } catch (_) {
      clearResizeTimers();
    }
  }

  function scheduleFit() {
    if (!resizeDisposed && !fitFrame) fitFrame = requestAnimationFrame(coordinateResize);
  }

  const resizeObserver = typeof ResizeObserver === 'function'
    ? new ResizeObserver(scheduleFit) : null;
  resizeObserver?.observe(document.getElementById('term'));

  function disposeResizeCoordinator() {
    resizeDisposed = true;
    clearResizeTimers();
    resizeObserver?.disconnect();
  }

  // El primer fit es sincrono: el payload de autenticacion debe llevar la
  // geometria real aun si el WebSocket abre antes del siguiente frame.
  try { fit.fit(); } catch (_) {}
  window.addEventListener('resize', scheduleFit);
  window.visualViewport?.addEventListener('resize', scheduleFit);
  window.addEventListener('pagehide', disposeResizeCoordinator);
  function resumeDeferredFitAfterSelection() {
    if (fitDeferredForSelection && !term.hasSelection()) {
      fitDeferredForSelection = false;
      scheduleFit();
    }
  }
  term.onSelectionChange(resumeDeferredFitAfterSelection);

  // ttyd protocol (ver ttyd/src/protocol.c y client/xterm/index.ts):
  //   auth  : primer mensaje = JSON crudo {AuthToken, columns, rows} (sin prefix)
  //   client -> server:  '0'+bytes = INPUT  '1'+JSON = RESIZE
  //                      '2' = PAUSE  '3' = RESUME
  //   server -> client:  '0'+bytes = OUTPUT '1'+txt  = TITLE  '2'+JSON = PREFS
  function createWebSocketReconnectController(
      connect, setTimer = setTimeout, clearTimer = clearTimeout) {
    let timer = null;
    let attempt = 0;
    let disposed = false;
    function schedule() {
      if (disposed || timer !== null) return false;
      const delay = Math.min(250 * (2 ** attempt), 4000);
      attempt = Math.min(attempt + 1, 5);
      timer = setTimer(() => {
        timer = null;
        if (!disposed) connect();
      }, delay);
      return delay;
    }
    function connected() {
      attempt = 0;
      if (timer !== null) clearTimer(timer);
      timer = null;
    }
    function dispose() {
      disposed = true;
      if (timer !== null) clearTimer(timer);
      timer = null;
    }
    return {schedule, connected, dispose};
  }

  let ws = null;
  let resizeReconnectSocket = null;
  let socketCloseCleanup = () => {};
  let connectionDown = false;
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  // Teclas escritas mientras el WS se reabre (rotar el movil cambia columnas
  // y reconecta) se guardan y salen al abrir. Acotado en bytes y en edad.
  const pendingInput = createInputQueue(4096, 15000, () => Date.now());
  // El composer solo se vacia cuando la terminal responde tras el envio.
  const inputAcks = createAckTracker(setTimeout, clearTimeout);

  function createInputQueue(maxBytes, maxAgeMs, now) {
    const sizer = new TextEncoder();
    let items = [], bytes = 0, since = 0;
    return {
      push(data) {
        const size = sizer.encode(data).length;
        if (bytes + size > maxBytes) return false;
        if (!items.length) since = now();
        items.push(data);
        bytes += size;
        return true;
      },
      drain() {
        const out = {items, stale: items.length > 0 && now() - since > maxAgeMs};
        items = [];
        bytes = 0;
        return out;
      },
    };
  }

  function createAckTracker(setTimer, clearTimer) {
    let waiters = [];
    function settle(socket, ok) {
      const done = waiters.filter(w => w.socket === socket);
      waiters = waiters.filter(w => w.socket !== socket);
      done.forEach(w => { clearTimer(w.timer); w.resolve(ok); });
    }
    return {
      wait(socket, ms) {
        return new Promise(resolve => {
          const waiter = {socket, resolve, timer: null};
          waiter.timer = setTimer(() => {
            waiters = waiters.filter(w => w !== waiter);
            resolve(false);
          }, ms);
          waiters.push(waiter);
        });
      },
      output(socket) { settle(socket, true); },
      closed(socket) { settle(socket, false); },
    };
  }

  function socketIsOpen() {
    return ws !== null && ws.readyState === 1;
  }

  function restartWebSocketForResize() {
    const socket = ws;
    if (!socket || socket.readyState !== 1) {
      reconnectController.schedule();
      return false;
    }
    resizeReconnectSocket = socket;
    try {
      socket.close(1000, 'resize');
      return true;
    } catch (_) {
      resizeReconnectSocket = null;
      reconnectController.schedule();
      return false;
    }
  }

  function inputFrame(data) {
    const buf = enc.encode(data);
    const out = new Uint8Array(buf.length + 1);
    out[0] = 0x30; // '0' = INPUT (client→server)
    out.set(buf, 1);
    return out;
  }

  // options.queue: teclas; si el WS esta cerrado se encolan en vez de perderse.
  function sendInput(data, options) {
    const queue = !!(options && options.queue);
    if (!socketIsOpen()) {
      if (queue && pendingInput.push(data)) return true;
      showErr(queue ? 'Terminal desconectada y demasiado texto en espera. No se ha enviado.'
        : 'Terminal desconectada. El borrador se conserva; vuelve a enviar al conectar.');
      return false;
    }
    try { ws.send(inputFrame(data)); return true; } catch (_) {
      showErr('No se pudo enviar. El borrador se conserva.');
      return false;
    }
  }

  function flushPendingInput(socket) {
    const {items, stale} = pendingInput.drain();
    if (!items.length) return;
    if (stale) {
      showErr('Se descartó lo tecleado durante la desconexión: era demasiado antiguo.');
      return;
    }
    try { items.forEach(data => socket.send(inputFrame(data))); } catch (_) {
      showErr('No se pudo enviar lo tecleado durante la reconexión.');
    }
  }
  let lastResize = '';
  function sendResize(size) {
    if (ws === null || ws.readyState !== 1) return;
    const cols = size && size.cols !== undefined ? size.cols : term.cols;
    const rows = size && size.rows !== undefined ? size.rows : term.rows;
    // Medida con el marco oculto o colapsado: no encoger la ventana tmux de todos.
    if (cols < 20 || rows < 5) return;
    const key = `${cols}x${rows}`;
    if (key === lastResize) return;
    lastResize = key;
    ws.send('1' + JSON.stringify({columns: cols, rows}));
  }
  // tmux da la ventana al último cliente que habló (window-size latest): al volver a
  // ver esta terminal se reenvía el tamaño para recuperarla del escritorio.
  function claimSize() { lastResize = ''; sendResize(); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) claimSize(); });
  window.addEventListener('focus', claimSize);

  function handleSocketMessage(data) {
    // Puede llegar como ArrayBuffer o string según el frame de ttyd.
    if (typeof data === 'string') {
      const cmd = data[0];
      const rest = data.slice(1);
      if (cmd === '0') term.write(rest);
      else if (cmd === '1') document.title = rest;
      else if (cmd === '2') {
        try {
          const prefs = JSON.parse(rest);
          if (prefs.fontFamily) term.options.fontFamily = prefs.fontFamily;
          if (prefs.fontSize)   term.options.fontSize   = +prefs.fontSize;
          scheduleFit();
        } catch (_) {}
      }
      return;
    }
    const bytes = new Uint8Array(data);
    const cmd = String.fromCharCode(bytes[0]);
    const rest = bytes.subarray(1);
    if (cmd === '0') term.write(rest);
    else if (cmd === '1') document.title = dec.decode(rest);
    else if (cmd === '2') {
      try {
        const prefs = JSON.parse(dec.decode(rest));
        if (prefs.fontFamily) term.options.fontFamily = prefs.fontFamily;

      if (!r.ok || data.ok === false) throw new Error(data.error || 'No se pudo cambiar de cuenta');
      say(`Interrumpiendo lo que está haciendo y pasando a ${alias} con la misma conversación…`);
      const done = await waitAccountSwitch(data.operationKey, data.operationId, alias, stage => { if (stage) say(stage); });
      refresh();
      if (done.awaiting) { say(done.detail); return; }
      if (!done.ok) throw new Error(done.detail || done.error || 'El cambio no se confirmó');
      say(`Listo: este pane ya sigue la misma conversación en ${alias}.`);
      setTimeout(() => { if (acctFor === pane) closeAccounts(); }, 2200);
    } catch (error) { say(error.message, true); box.querySelectorAll('.acc[data-alias]').forEach(b => { b.disabled = b.classList.contains('on'); }); }
  }
  document.addEventListener('mousedown', e => { if (acctFor && !acctMenu.contains(e.target) && !(e.target.closest && e.target.closest('button[data-act="acct"]'))) closeAccounts(); }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && acctFor) closeAccounts(); });
  async function refresh() {
    if (busy || document.hidden) return;
    busy = true;
    const t0 = Date.now();
    try {
      const h = { 'Content-Type': 'application/json', 'X-Comandos-Token': token };
      const [list, tm] = await Promise.all([
        fetch('/terminal-panes', { method: 'POST', cache: 'no-store', headers: h, body: JSON.stringify({ session, action: 'list' }) }).then(r => r.json()),
        fetch('/tab-models?session=' + encodeURIComponent(session), { cache: 'no-store', headers: h }).then(r => r.json()),
      ]);
      if (list && Array.isArray(list.panes)) {
        panes = list.panes;
        // tmux confirma el pane de este dispositivo: manda sobre el clic local, salvo
        // que la respuesta salió antes de ese clic.
        if (list.remoteFocus && t0 >= localAt) { remoteFocus = list.remoteFocus; localActive = null; }
        else if (!list.remoteFocus) remoteFocus = null;
      }
      if (tm && Array.isArray(tm.panes)) models = tm.panes;
      draw();
    } catch (_) { /* la próxima vuelta reintenta */ } finally { busy = false; }
  }
  let soon = 0;
  const later = () => { clearTimeout(soon); soon = setTimeout(() => { draw(); refresh(); }, 60); };
  term.onResize(later);
  if (typeof ResizeObserver === 'function') new ResizeObserver(later).observe(document.getElementById('term'));
  setInterval(refresh, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  refresh();
  }
})();
</script>
</body>
