<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<!-- Prototipo recuperado de la sesión a3ef41dd-92bf-422b-a5bf-ff9865abbc00. Cinco diseños de tarjetas; los datos son una captura y las acciones son simuladas. -->
<title>ComandOS · tarjetas de uso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@400;500;600;700&family=Ubuntu+Sans+Mono:wght@400;500;600;700&display=swap">
<style>
/* Columna izquierda de ComandOS (tema termius, 320 px): tarjetas de uso, % usado 0→100. */
:root{
  color-scheme:dark;
  --bg:#0E1620; --panel:#141E2A; --panel2:#182432; --deep:#0B121B; --line:#1C2733; --line2:#25384F;
  --text:#D6E0EA; --dim:#8FA0B4; --faint:#5C6B80;
  --brand:#4CE07A; --warn:#FFAE1A; --bad:#FF7580;
  --page:#0A121B; --shadow:rgba(0,0,0,.55);
  --ui:"Ubuntu Sans",system-ui,sans-serif; --mono:"Ubuntu Sans Mono",ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:var(--ui);margin:0;padding-inline:16px;padding-block:16px;box-sizing:border-box;overflow-x:hidden}
.intro{max-width:760px;margin:0 auto 12px}
.intro h1{font-size:17px;margin:0 0 4px;font-weight:600}
.intro p{margin:0;color:var(--dim);font-size:13px}
#stage{display:flex;justify-content:center}
.col{width:var(--cw,320px);height:740px;max-width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px var(--shadow);flex:none}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{display:block}
.keys{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.key{width:32px;height:32px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);flex:none;position:relative}
.key.on{border-color:color-mix(in srgb,var(--brand) 55%,var(--line2))}
.key .badge{position:absolute;top:-7px;right:-6px;background:var(--warn);color:#201300;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;line-height:14px}
.key.pomo{margin-left:auto;width:52px}
.clock{font:600 12px/1 var(--mono);color:var(--dim);padding:0 2px}
.tools{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tb{flex:1;height:30px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--dim)}
.area{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.head{display:flex;align-items:baseline;gap:8px;padding:12px 12px 8px}
.head b{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.head small{font-size:11px;color:var(--faint);margin-left:auto}
.list{display:flex;flex-direction:column;gap:9px;padding:0 10px 12px}
.foot{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.foot span{margin-left:auto;height:26px;padding:0 12px;border-radius:8px;border:1px solid var(--brand);color:var(--brand);font-weight:600;display:grid;place-items:center}
.tt{display:flex;align-items:center;gap:6px;padding:7px 8px;border-top:1px solid var(--line)}
.tw{display:flex;align-items:center;gap:6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);padding:3px 9px;font:11px var(--mono)}
.tw i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.plus{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1px dashed var(--brand);color:var(--brand);display:grid;place-items:center}

.logo{width:24px;height:24px;border-radius:7px;background:#0A0D13;border:1px solid #ffffff14;display:grid;place-items:center;flex:none}
.logo svg{width:15px;height:15px}
.nm{display:flex;flex-direction:column;min-width:0}
.nm b{font-size:13px;font-weight:600;line-height:1.1}
.nm small{font:10.5px var(--mono);color:var(--dim)}
.pane{font:600 9.5px var(--mono);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 45%,var(--line2));border-radius:999px;padding:1px 6px;white-space:nowrap}
.warn{color:var(--warn)} .bad{color:var(--bad)}
.card{width:100%;display:block;border-radius:16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

/* detalle (clic) — compartido */
.det{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #ffffff1c;font-size:11.5px;color:var(--dim);gap:8px;flex-direction:column}
.card.open .det{display:flex}
.det .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.det .kv b{color:var(--text);font-weight:500;font-family:var(--mono);font-size:11px}
.det .acts{display:flex;gap:6px;flex-wrap:wrap}
.det .acts span{height:28px;padding:0 11px;border-radius:8px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--text);background:#ffffff08}
.det .acts span.pri{background:var(--ac);border-color:var(--ac);color:#0A0D13}

/* ===== 1 Medidor ===== */
.d1 .card{padding:12px;background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 55%),linear-gradient(180deg,#172231,#111a25);border:1px solid #ffffff12}
.d1 .card.cur{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.d1 .top{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.d1 .g{position:relative;width:76px;height:76px}
.d1 .g .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.d1 .g .v b{font:700 20px/1 var(--mono);letter-spacing:-.02em}
.d1 .g .v small{display:block;font:9px var(--mono);color:var(--dim);margin-top:2px}
.d1 .info{display:flex;flex-direction:column;gap:7px;min-width:0}
.d1 .who{display:flex;align-items:center;gap:8px}
.d1 .who .pane{margin-left:auto}
.d1 .ln{display:grid;grid-template-columns:52px 1fr 30px;gap:6px;align-items:center;font-size:10.5px;color:var(--dim)}
.d1 .ln .t{height:5px;border-radius:3px;background:#ffffff10;overflow:hidden}
.d1 .ln .t i{display:block;height:100%;border-radius:3px;background:var(--lc)}
.d1 .ln b{font:600 10.5px var(--mono);text-align:right;color:var(--text)}
.d1 .sub{font-size:10.5px;color:var(--dim)}

/* ===== 2 Tanque ===== */
.d2 .card{padding:12px 12px 11px;background:#0d151f;border:1px solid #ffffff14;isolation:isolate}
.d2 .card.cur{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.d2 .liq{position:absolute;left:0;top:0;bottom:0;width:var(--w);z-index:-1;background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 10%,transparent),color-mix(in srgb,var(--lc) 34%,transparent));}
.d2 .liq::after{content:"";position:absolute;right:-9px;top:0;bottom:0;width:18px;background:radial-gradient(9px 12px at 0 50%,color-mix(in srgb,var(--lc) 34%,transparent) 98%,transparent) 0 0/18px 24px repeat-y;animation:drip 3.5s linear infinite}
@keyframes drip{to{background-position:0 24px}}
@media (prefers-reduced-motion:reduce){.d2 .liq::after{animation:none}}
.d2 .liq::before{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:color-mix(in srgb,var(--lc) 85%,#fff 15%);box-shadow:0 0 12px var(--lc)}
.d2 .row1{display:flex;align-items:center;gap:9px}
.d2 .big{margin-left:auto;font:700 30px/1 var(--mono);letter-spacing:-.03em;text-shadow:0 2px 14px #0008}
.d2 .why{margin-top:6px;font-size:11px;color:var(--dim)}
.d2 .why b{color:var(--text);font-weight:600}
.d2 .pills{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.d2 .pill{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:#0A0D13cc;border:1px solid #ffffff14;font:10.5px var(--mono);color:var(--dim);backdrop-filter:blur(4px)}
.d2 .pill b{color:var(--text);font-weight:600}
.d2 .pill i{width:6px;height:6px;border-radius:50%;background:var(--lc)}

/* ===== 3 LED ===== */
.d3 .card{padding:11px 12px 12px;background:linear-gradient(180deg,#121b26,#0c131c);border:1px solid #ffffff10;box-shadow:inset 0 1px 0 #ffffff0d}
.d3 .card.cur{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.d3 .row1{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.d3 .row1 .big{margin-left:auto;font:700 18px/1 var(--mono)}
.d3 .meter{display:grid;grid-template-columns:54px 1fr 32px;gap:8px;align-items:center;margin-top:5px}
.d3 .meter span{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.d3 .meter b{font:600 11px var(--mono);text-align:right}
.d3 .seg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:12px}
.d3 .seg i{border-radius:2px;background:#ffffff0c}
.d3 .seg i.on{background:var(--lc);box-shadow:0 0 6px color-mix(in srgb,var(--lc) 70%,transparent)}
.d3 .meter .r{grid-column:2/4;font:9.5px var(--mono);color:var(--faint);margin-top:-3px}

/* ===== 4 Anillos ===== */
.d4 .card{padding:12px;background:radial-gradient(90% 140% at 100% 0%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%),#111a25;border:1px solid #ffffff12}
.d4 .card.cur{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.d4 .row1{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.d4 .row1 .pane{margin-left:auto}
.d4 .body{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.d4 .rings{position:relative;width:84px;height:84px;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ac) 35%,transparent))}
.d4 .rings svg{width:84px;height:84px;transform:rotate(-90deg)}
.d4 .leg{display:flex;flex-direction:column;gap:7px}
.d4 .leg div{display:grid;grid-template-columns:8px 1fr auto;gap:7px;align-items:center;font-size:11px;color:var(--dim)}
.d4 .leg i{width:8px;height:8px;border-radius:50%;background:var(--lc);box-shadow:0 0 6px var(--lc)}
.d4 .leg b{font:600 13px var(--mono);color:var(--text)}
.d4 .leg small{grid-column:2/4;font:9.5px var(--mono);color:var(--faint);margin-top:-5px}

/* ===== 5 Ritmo ===== */
.d5 .card{padding:12px;background:linear-gradient(180deg,#152030,#101923);border:1px solid #ffffff12}
.d5 .card.cur{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.d5 .row1{display:flex;align-items:center;gap:9px}
.d5 .big{margin-left:auto;text-align:right}
.d5 .big b{display:block;font:700 22px/1 var(--mono)}
.d5 .big small{font-size:10px;color:var(--dim)}
.d5 .fc{margin:9px 0 2px;padding:7px 9px;border-radius:9px;font-size:11px;line-height:1.35;background:#ffffff07;border:1px solid #ffffff10;color:var(--dim)}
.d5 .fc b{color:var(--text);font-weight:600}
.d5 .fc.hot{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.d5 .fc.hot b{color:var(--bad)}
.d5 .fc.ok b{color:var(--brand)}
.d5 .tr{margin-top:8px}
.d5 .tr .lb{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--dim);margin-bottom:4px}
.d5 .tr .lb b{color:var(--text)}
.d5 .tr .bar{position:relative;height:8px;border-radius:4px;background:#ffffff0d}
.d5 .tr .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;width:var(--w);background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 55%,transparent),var(--lc))}
.d5 .tr .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;left:var(--t);background:#fff;border-radius:1px;box-shadow:0 0 0 2px #0008}

/* OpenCode (sin cuota): compartido, adapta el fondo de cada diseño */
.free .fr{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.free .fr span{flex:1;min-width:70px;padding:7px 8px;border-radius:9px;background:#ffffff07;border:1px solid #ffffff10;font-size:10px;color:var(--dim)}
.free .fr span b{display:block;font:600 13px var(--mono);color:var(--text)}
.free .tag{margin-left:auto;font:600 10px var(--mono);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:999px;padding:2px 7px}

#picker{position:fixed;right:16px;bottom:16px;z-index:100;width:340px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 50px var(--shadow);font-size:12px;user-select:none}
#picker .drag{cursor:grab;padding:8px 12px 0;display:flex;justify-content:space-between;color:var(--faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
#picker .nav{display:flex;align-items:center;gap:8px;padding:6px 10px}
#picker .nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:16px;text-align:center}
#picker .nm2{flex:1;min-width:0;text-align:center}
#picker .nm2 b{display:block;font-size:14px}
#picker .nm2 span{display:block;color:var(--dim);font-size:11px;line-height:1.35;margin-top:2px}
#picker .sts{display:flex;flex-wrap:wrap;gap:5px;padding:9px 10px 10px;border-top:1px solid var(--line);margin-top:4px}
#picker .sts button{height:26px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);font-size:11px;padding:0 9px;color:var(--dim)}
#picker .sts button.on{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--bg))}

/* En celular el selector debe dejar espacio para revisar y tocar las tarjetas. */
@media (max-width:700px){
  body{height:100dvh;display:flex;flex-direction:column;padding-bottom:230px}
  .intro{flex:none;margin-bottom:12px}
  #stage{flex:1;min-height:0}
  .col{height:100%;box-sizing:border-box}
  #picker{left:16px;right:16px;width:auto;max-width:none}
}
</style>
</head>
<body>
<div class="intro"><h1>Tarjetas de uso · prototipo</h1><p>% usado de 0 a 100, con todas tus cuentas (Antigravity, Grok y OpenCode incluidos). ← → cambia de diseño; toca una tarjeta para ver qué hace el clic.</p><p style="margin-top:6px;font-size:11px;color:var(--faint)">Datos de la sesión del 2 de octubre. Las acciones son una propuesta y no cambian cuentas.</p></div>
<div id="stage"></div>
<div id="picker" role="region" aria-label="Diseños">
  <div class="drag" id="drag"><span>Diseño <span id="pidx">1/5</span></span><span>arrástrame</span></div>
  <div class="nav"><button id="prev" aria-label="Diseño anterior">←</button><div class="nm2"><b id="pname"></b><span id="pdesc"></span></div><button id="next" aria-label="Diseño siguiente">→</button></div>
  <div class="sts" id="states"></div>
</div>

const tone=u=>u>=90?'bad':u>=70?'warn':'';

 <div class="info"><div class="who">${logo(a)}${nm(a)}${a.cur?'<span class="pane">este pane</span>':''}</div>
 ${a.L.map(l=>`<div class="ln" style="--lc:${lc(a,l[2])}"><span>${l[1]}</span><span class="t"><i style="width:${Math.max(l[2],2)}%"></i></span><b class="${tone(l[2])}">${l[2]}%</b></div>`).join('')}</div></div>
 <div class="sub" style="margin-top:8px">${why(a)}</div>${det(a)}</button>`}
function d2(a){if(a.free)return freeCard(a);const t=peakLimit(a);
 return `<button ${cardAttrs(a)}><span class="liq"></span><div class="row1">${logo(a)}${nm(a)}${a.cur?'<span class="pane">este pane</span>':''}<b class="big ${tone(t[2])}">${t[2]}%</b></div>
 <div class="why">${why(a)}</div><div class="pills">${a.L.map(l=>`<span class="pill" style="--lc:${lc(a,l[2])}"><i></i>${l[1]} <b class="${tone(l[2])}">${l[2]}%</b></span>`).join('')}</div>${det(a)}</button>`}
function d3(a){if(a.free)return freeCard(a);const t=peakLimit(a);
 return `<button ${cardAttrs(a)}><div class="row1">${logo(a)}${nm(a)}${a.cur?'<span class="pane">este pane</span>':''}<b class="big ${tone(t[2])}">${t[2]}%</b></div>
 ${a.L.map(l=>{const n=Math.round(l[2]/5);return `<div class="meter" style="--lc:${lc(a,l[2])}"><span>${l[1]}</span><span class="seg">${Array.from({length:20},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span><b class="${tone(l[2])}">${l[2]}%</b><span class="r">se reinicia en ${l[3]}</span></div>`}).join('')}${det(a)}</button>`}
function rings(a){const R=[37,29,21],id=a.id;
 return `<svg viewBox="0 0 84 84">${a.L.map((l,i)=>{const C=2*Math.PI*R[i];return `<circle cx="42" cy="42" r="${R[i]}" fill="none" stroke="#ffffff10" stroke-width="6.5"/><circle cx="42" cy="42" r="${R[i]}" fill="none" stroke="${lc(a,l[2]).startsWith('var')?(l[2]>=90?'#FF7580':'#FFAE1A'):a.c}" stroke-opacity="${[1,.75,.5][i]}" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="${C*Math.max(l[2],.8)/100} ${C}"/>`}).join('')}</svg>`}
function d4(a){if(a.free)return freeCard(a);
 return `<button ${cardAttrs(a)}><div class="row1">${logo(a)}${nm(a)}${a.cur?'<span class="pane">este pane</span>':''}</div>
 <div class="body"><div class="rings">${rings(a)}</div><div class="leg">${a.L.map((l,i)=>`<div style="--lc:${lc(a,l[2])}"><i style="opacity:${[1,.75,.5][i]}"></i>${l[1]}<b class="${tone(l[2])}">${l[2]}%</b><small>se reinicia en ${l[3]}</small></div>`).join('')}</div></div>${det(a)}</button>`}
function pace(a){const t=peakLimit(a);if(t[2]>=100)return {cls:'hot',txt:`<b>Agotada</b>: vuelve en ${t[3]}.`};
 const el=1-t[5]/t[4],ahead=Math.round(t[2]-el*100);
 const rate=t[2]/Math.max(el*t[4],.1),toFull=(100-t[2])/Math.max(rate,.0001);
 if(toFull<t[5])return {cls:'hot',txt:`A este ritmo <b>se acaba en ~${toFull<1?Math.round(toFull*60)+' min':toFull.toFixed(0)+' h'}</b>, antes del reinicio.`};
 return {cls:'ok',txt:ahead>0?`Vas ${ahead} puntos por delante del tiempo, pero <b>te alcanza</b>.`:`Vas ${-ahead} puntos por debajo del tiempo: <b>te sobra</b>.`}}
function d5(a){if(a.free)return freeCard(a);const t=peakLimit(a),p=pace(a);
 return `<button ${cardAttrs(a)}><div class="row1">${logo(a)}${nm(a)}${a.cur?'<span class="pane">este pane</span>':''}<span class="big"><b class="${tone(t[2])}">${t[2]}%</b><small>${lab(t)}</small></span></div>
 <div class="fc ${p.cls}">${p.txt}</div>
 ${a.L.map(l=>`<div class="tr" style="--lc:${lc(a,l[2])};--w:${Math.max(l[2],2)}%;--t:${Math.round((1-l[5]/l[4])*100)}%"><div class="lb"><span>${l[1]} · reinicia en ${l[3]}</span><b class="${tone(l[2])}">${l[2]}%</b></div><div class="bar"><i></i><em title="ahora"></em></div></div>`).join('')}${det(a)}</button>`}
const V=[d1,d2,d3,d4,d5];
function render(){
 const w=S.st==='narrow'?260:S.st==='phone'?390:320;
 document.getElementById('stage').innerHTML=`<div class="col" style="--cw:${w}px">
 <div class="keys"><span class="key"></span><span class="key on"></span><span class="key"></span><span class="key"><span class="badge">491</span></span><span class="key pomo"></span><span class="clock">10:58</span><span class="key"></span></div>
 <div class="tools"><span class="tb">Comandos</span><span class="tb">Cadenas</span><span class="tb">Servidores</span></div>
 <div class="area"><div class="head"><b>Uso de tus cuentas</b><small>% usado</small></div><div class="list d${S.d+1}">${ACC.map(V[S.d]).join('')}</div></div>
 <div class="foot">Terminales escondidas<span>Mostrar terminal</span></div>
 <div class="tt"><span class="tw"><i></i>02:19</span><span class="plus">+</span></div></div>`;
 const D=DES[S.d];
 document.getElementById('pidx').textContent=`${S.d+1}/5`;
 document.getElementById('pname').textContent=D.n;
 document.getElementById('pdesc').textContent=D.d;
 document.getElementById('states').innerHTML=STATES.map(([k,l])=>`<button class="${k===S.st?'on':''}" data-st="${k}">${l}</button>`).join('');
}
document.getElementById('stage').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;
 if(S.st==='open'&&S.open===c.dataset.id){S.st='now';}else{S.st='open';S.open=c.dataset.id;}render();});
document.getElementById('states').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(b){S.st=b.dataset.st;render();}});
const go=d=>{S.d=(S.d+d+5)%5;render();};
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);});
(()=>{const p=document.getElementById('picker'),h=document.getElementById('drag');let sx,sy,ox,oy,on=false;
 h.addEventListener('pointerdown',e=>{on=true;h.setPointerCapture(e.pointerId);const r=p.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;});
 h.addEventListener('pointermove',e=>{if(!on)return;p.style.left=Math.max(0,ox+e.clientX-sx)+'px';p.style.top=Math.max(0,oy+e.clientY-sy)+'px';p.style.right='auto';p.style.bottom='auto';});
 h.addEventListener('pointerup',()=>{on=false;});})();
render();
</script>

</body>
</html>
