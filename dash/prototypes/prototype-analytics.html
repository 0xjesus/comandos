<meta charset="utf-8">
<title>Analytics ComandOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Ubuntu+Sans+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: modal de Analytics sobre la cabecera atenuada; cuentas en 2×2 (tanque protagonista) y la semana en línea de tiempo con carriles. */
:root{
  --bg:#0A0D13; --panel:#121722; --panel2:#161C29; --well:#0D1119; --line:#222A3A; --line2:#2E3852;
  --fg:#EAF0FB; --mut:#9AA6BF; --dim:#5E6980;
  --ok:#2EE59D; --warn:#FFAE1A; --bad:#FF7580; --brand:#8B7CFF;
  --a-main:#8B7CFF; --a-relotto:#FF9A5C; --a-codex:#4CC2FF; --a-grok:#C5E35A;
  --sans:'Inter',system-ui,sans-serif; --mono:'Ubuntu Sans Mono','JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.app{padding-inline:16px;padding-block:14px 140px}
.hdr{display:flex;gap:8px;align-items:center;opacity:.35;padding:0 0 14px;max-width:1120px;margin:0 auto}
.hdr i{display:block;height:32px;border-radius:9px;background:var(--panel);border:1px solid var(--line)}
.modal{max-width:1120px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px 26px;box-shadow:0 40px 90px #000a}
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.mhead h2{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:2px;padding:3px;background:var(--well);border:1px solid var(--line);border-radius:10px}
.tab{font-size:12.5px;color:var(--mut);padding:6px 12px;border-radius:7px;font-weight:500}
.tab.on{background:var(--panel2);color:var(--fg);box-shadow:0 1px 0 #ffffff0d inset,0 1px 3px #0006}
.mhead .stamp{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.sect{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.sect h3{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.sect span{font-size:12px;color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* tarjetas de cuenta */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden}
.c-head{display:flex;align-items:center;gap:8px}
.c-head .dot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.c-head b{font-size:15px;font-weight:600}
.c-head small{font-family:var(--mono);font-size:12px;color:var(--mut);padding:1px 7px;border:1px solid var(--line2);border-radius:6px}
.flag{margin-left:auto;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px}
.flag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.flag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:12px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats small{font-size:11px;color:var(--dim);letter-spacing:.04em}
.stats b{font-family:var(--mono);font-size:15px;font-weight:500}
.stats em{font-style:normal;font-size:11.5px;color:var(--mut);font-family:var(--mono)}
.reset{font-size:12.5px;color:var(--mut)} .reset b{color:var(--fg);font-weight:500}
.sub{display:grid;grid-template-columns:52px 1fr 40px;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.sub .tr{height:4px;border-radius:2px;background:#232b3c;position:relative;overflow:hidden}
.sub .tr i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--fc)}
.sub b{font-family:var(--mono);font-weight:500;color:var(--fg);text-align:right}
.subs{display:flex;flex-direction:column;gap:8px}
.hero{display:flex;flex-direction:column;gap:2px}
.hero .n{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:.95}
.hero .n sup{font-size:20px;font-weight:600;letter-spacing:0;margin-left:2px;vertical-align:26px;color:var(--mut)}
.hero .l{font-size:12.5px;color:var(--mut)}

/* V1 botella */
.v1{display:grid;grid-template-columns:118px 1fr;gap:22px;align-items:center}
.v1 .side{display:flex;flex-direction:column;gap:14px;min-width:0}
/* V2 dial */
.v2{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.v2 .minis{display:flex;gap:16px;align-items:center}
.v2 .mini{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
.v2 .mini b{font-family:var(--mono);color:var(--fg);font-weight:500;font-size:13px}
/* V3 borde */
.card.v3card{padding-right:86px}
.edge{position:absolute;top:0;right:0;bottom:0;width:68px;background:var(--well);border-left:1px solid var(--line)}
.edge .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 75%,#fff 25%),color-mix(in srgb,var(--ac) 80%,#000 20%));transition:height .8s cubic-bezier(.2,.8,.2,1)}
.edge .fill::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:#ffffffaa}
.edge .tk{position:absolute;right:0;height:1px;background:#ffffff40}
.edge .tl{position:absolute;right:10px;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:#ffffffb0;mix-blend-mode:difference}
/* V4 matriz */
.v4{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.dm{display:grid;grid-template-columns:repeat(9,9px);grid-auto-rows:9px;gap:4px;padding:10px;background:var(--well);border:1px solid var(--line);border-radius:10px}
.dm i{border-radius:50%;background:#1b2231}
.dm i.on{background:var(--ac);box-shadow:0 0 6px color-mix(in srgb,var(--ac) 70%,transparent)}
.dm i.top{background:color-mix(in srgb,var(--ac) 55%,#fff 45%)}
.rows{font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;gap:7px;min-width:0}
.rows div{display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.rows span{color:var(--mut);letter-spacing:.06em;font-size:11.5px}
.rows i{flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-3px);min-width:12px}
.rows b{font-weight:600}
.rows .big b{font-size:30px;letter-spacing:-.02em}
/* V5 cilindros */
.v5{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:end}
.v5 .set{display:flex;gap:10px;align-items:flex-end}
.v5 .cap{font-size:11px;color:var(--mut);text-align:center;margin-top:4px}
.v5 .cap b{display:block;font-family:var(--mono);color:var(--fg);font-size:13px;font-weight:500}

/* línea de tiempo */
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--well)}
.tl{min-width:720px;display:grid;grid-template-columns:96px 1fr 64px}
.tl .ax{position:relative;height:28px;border-bottom:1px solid var(--line)}
.tl .ax span{position:absolute;top:8px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.tl .d{padding:0 12px;display:flex;align-items:center;font-size:12.5px;color:var(--mut);border-bottom:1px solid #161c28}
.tl .d b{color:var(--fg);font-weight:600;margin-right:5px}
.tl .row{position:relative;border-bottom:1px solid #161c28;background:repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px calc(100%/8))}
.tl .t{display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-family:var(--mono);font-size:12px;color:var(--mut);border-bottom:1px solid #161c28}
.blk{position:absolute;height:20px;border-radius:5px;background:color-mix(in srgb,var(--ac) 82%,#000 18%);border:1px solid color-mix(in srgb,var(--ac) 70%,#fff 30%);font-size:11px;font-weight:600;color:#0A0D13;padding:2px 6px;white-space:nowrap;overflow:hidden;cursor:default}
.blk:hover,.blk:focus{outline:2px solid #fff;outline-offset:1px;z-index:2}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.now::after{content:"ahora";position:absolute;top:-1px;left:5px;font-family:var(--mono);font-size:10px;color:var(--bad)}
.tl-foot{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12px;color:var(--mut)}
.tl-foot .k{display:inline-flex;align-items:center;gap:6px}.tl-foot .k i{width:10px;height:10px;border-radius:3px;background:var(--ac)}
.tl-info{margin-left:auto;font-family:var(--mono);color:var(--fg)}

/* animaciones */
.wave{animation:wave 7s linear infinite}
@keyframes wave{to{transform:translateX(var(--sh,-80px))}}
@media (prefers-reduced-motion:reduce){.wave{animation:none}.edge .fill{transition:none}}


/* ronda 3 botellas */
.bx{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.bx .side{display:flex;flex-direction:column;gap:14px;min-width:0}
.rack{display:flex;gap:16px;align-items:flex-end}
.rack .cap,.shelf .cap{font-size:11px;color:var(--mut);text-align:center;margin-top:2px}
.rack .cap b,.shelf .cap b{display:block;font-family:var(--mono);color:var(--fg);font-size:13px;font-weight:500}
.shelf{display:flex;gap:8px;align-items:flex-end;position:relative;padding:0 6px}.shelf .sb>svg{margin-bottom:-8px;position:relative;z-index:1}.shelf::after{content:"";position:absolute;left:0;right:0;bottom:30px;height:6px;border-radius:3px;background:linear-gradient(180deg,#2a3346,#161c29);box-shadow:0 6px 12px #0008}.shelf .cap{margin-top:12px}
.shelf .sb{display:flex;flex-direction:column;align-items:center}
.shelf .sb>svg{display:block}
.mirror{height:30px;overflow:hidden;opacity:.16;margin-top:-2px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.mirror svg{display:block;transform:scaleY(-1);transform-origin:50% 50%;margin-top:calc(-100% * 0)}
.bub{opacity:0;animation:rise 4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.5}100%{transform:translateY(var(--rise));opacity:0}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}


/* ronda 4 */
.ltile{display:inline-grid;place-items:center;border-radius:7px;background:#0A0D13;border:1px solid var(--line2);flex:none}
.ltile svg{display:block}
.bottles{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.card.solo .bottles{align-items:center;gap:24px}
.card.solo .stats.s2{flex:1;border-top:0;padding-top:0;grid-template-columns:1fr;gap:14px;min-width:160px}
.card.solo .stats.s2 div+div{border-left:0;padding-left:0}
.stats.s2{grid-template-columns:repeat(2,1fr)}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.bcap{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.bcap span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.bcap b{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em}
.bcap b.warn{color:var(--warn)}.bcap b.bad{color:var(--bad)}
.bcap em{white-space:nowrap;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim)}
.rackE{display:flex;flex-direction:column;align-items:stretch;gap:0}
.tubes{display:flex;gap:34px;padding:0 18px;justify-content:center}
.rbase{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:-30px;position:relative;z-index:2;height:34px;border-radius:6px;background:linear-gradient(180deg,#2c3448,#1a2030);border:1px solid #ffffff1a;box-shadow:0 8px 16px #0008;font-size:12px;font-weight:600;color:var(--fg);padding:0 12px}
.tcaps{display:flex;gap:0;justify-content:center;margin-top:10px}
.tcaps .bcap{width:80px}.tcaps .bcap span{white-space:nowrap}
.bar{position:relative;border-radius:14px;background:linear-gradient(180deg,#0e1320,#0b0f17);border:1px solid var(--line);overflow:hidden;padding:26px 20px 0}
.bar-glow{position:absolute;inset:0 0 auto;height:70%;background:radial-gradient(ellipse at 50% 0,#8B7CFF22,transparent 60%),radial-gradient(ellipse at 15% 10%,#FF9A5C14,transparent 50%),radial-gradient(ellipse at 85% 10%,#4CC2FF14,transparent 50%);pointer-events:none}
.bar-row{position:relative;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.bgrp{display:flex;flex-direction:column;align-items:center;gap:12px}
.bgrp-b{display:flex;gap:6px;align-items:flex-end}
.plaque{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:8px;background:linear-gradient(180deg,#2d3549,#1b2131);border:1px solid #ffffff22;border-top-color:color-mix(in srgb,var(--ac) 60%,#fff 10%);font-size:12.5px;margin-bottom:14px}
.plaque small{font-family:var(--mono);color:var(--mut);font-size:11px}
.bar-wood{height:14px;margin:0 -20px;background:linear-gradient(180deg,#30394f,#141925);border-top:1px solid #ffffff22}
.bar-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;margin-top:12px}
.bar-stats div{display:grid;grid-template-columns:10px 1fr;gap:2px 8px;font-size:12px;color:var(--mut);align-items:center}
.bar-stats .dot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.bar-stats b{color:var(--fg);font-weight:600;font-size:13px}
.bar-stats span:not(.dot){grid-column:2;font-family:var(--mono)}


/* ronda 5: semana */
.tip{position:fixed;z-index:60;pointer-events:none;background:#0A0D13;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px #000a;max-width:320px}
.tip b{font-size:13px}.tip span{font-family:var(--mono);font-size:11.5px;color:var(--fg)}.tip em{font-style:normal;font-size:11.5px;color:var(--mut)}
.wk-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:12px}
.wk-sum div{padding:12px 16px;display:flex;flex-direction:column;gap:3px}.wk-sum div+div{border-left:1px solid var(--line)}
.wk-sum small{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}.wk-sum b{font-family:var(--mono);font-size:20px;font-weight:600}.wk-sum em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--mut)}
.wk-box{border:1px solid var(--line);border-radius:12px;background:var(--well);padding:14px 16px;overflow-x:auto}
.wk-note{font-size:12px;color:var(--dim);margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex:none}
.dim{color:var(--dim)}
/* W1 */
.gantt{display:grid;min-width:820px;align-items:stretch}
.g-corner{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;padding:0 0 8px}.g-corner.r{text-align:right}
.g-day{font-size:12px;color:var(--mut);padding:0 0 8px 6px;border-left:1px solid #1d2433}.g-day b{color:var(--fg)}
.g-day.today,.g-cell.today{background:#8B7CFF0d}
.g-name{display:flex;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid #1a2130;min-width:0;white-space:nowrap}
.g-cell{position:relative;border-top:1px solid #1a2130;border-left:1px solid #1d2433}
.g-bar{position:absolute;top:50%;height:12px;margin-top:-6px;border-radius:3px;background:var(--ac);box-shadow:0 0 0 1px #0A0D13}
.g-bar:hover{outline:2px solid #fff;z-index:2}
.g-tot{font-family:var(--mono);font-size:12.5px;text-align:right;padding:7px 0;border-top:1px solid #1a2130;color:var(--fg)}
.g-foot{font-family:var(--mono);font-size:12px;padding:8px 6px 0;border-top:1px solid var(--line2);border-left:1px solid #1d2433;display:flex;flex-direction:column}.g-foot em{font-style:normal;color:var(--dim);font-size:10.5px}
/* W2 */
.heat{display:grid;grid-template-columns:96px repeat(24,minmax(22px,1fr)) 100px;gap:3px;min-width:820px;align-items:center}
.heat>span{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.hm-day{font-size:12.5px;color:var(--mut)}.hm-day b{color:var(--fg)}.hm-day.today b{color:var(--brand)}
.hm{display:block;height:26px;border-radius:4px;background:#151b27}
.hm.on{background:color-mix(in srgb,var(--ac) calc(var(--a)*100%),#151b27)}
.hm.on:hover{outline:2px solid #fff}
.hm-tot{font-family:var(--mono);font-size:12px;text-align:right;display:flex;flex-direction:column}.hm-tot em{font-style:normal;font-size:10.5px;color:var(--dim)}
.hm-col{height:28px;display:flex;align-items:flex-end}.hm-col i{display:block;width:100%;background:#2E3852;border-radius:2px 2px 0 0}
/* W3 */
.c3-wrap{display:grid;grid-template-columns:1fr 250px;gap:22px}
.c3-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;min-width:560px}
.c3{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.c3-val{font-family:var(--mono);font-size:12px;text-align:center;height:16px}
.c3-stack{display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line2)}
.c3-stack>div{display:flex;flex-direction:column-reverse;gap:2px}
.c3-stack i{font-style:normal;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ac) 85%,#000);border-radius:4px;min-height:3px;overflow:hidden}
.c3-stack i:hover{outline:2px solid #fff}
.c3-stack i span{font-size:10.5px;font-weight:600;color:#0A0D13;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.c3-l{text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column}.c3-l b{color:var(--fg)}.c3-l em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim)}
.c3.today .c3-l b{color:var(--brand)}
.c3-leg h5{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.lg{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 0;font-size:12.5px;margin-bottom:9px}
.lg b{font-family:var(--mono);font-weight:500}.lg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg i{grid-column:1/-1;height:3px;border-radius:2px;background:var(--ac);opacity:.8}
/* W4 */
.cal{display:grid;grid-template-columns:52px 1fr;gap:0;padding-top:0}
.cal-axis{position:relative;margin-top:44px}.cal-axis span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.cal-cols{display:grid;grid-template-columns:repeat(8,minmax(84px,1fr));min-width:720px}
.cal-col{border-left:1px solid #1d2433}.cal-col.today{background:#8B7CFF0b}
.cal-h{height:44px;padding:8px 8px 0;font-size:12px;color:var(--mut);display:flex;flex-direction:column}.cal-h b{color:var(--fg)}.cal-h em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim)}
.cal-col.today .cal-h b{color:var(--brand)}
.cal-body{position:relative;background:repeating-linear-gradient(180deg,#ffffff08 0 1px,transparent 1px 60px)}
.ev{position:absolute;margin-left:2px;border-radius:5px;background:color-mix(in srgb,var(--ac) 28%,#0d1220);border-left:3px solid var(--ac);padding:2px 5px;overflow:hidden;display:flex;flex-direction:column;cursor:default}
.ev:hover{outline:2px solid #fff;z-index:3}
.ev b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev span{font-family:var(--mono);font-size:10px;color:var(--mut)}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--bad);box-shadow:0 0 6px var(--bad)}
/* W5 */
.w5{padding:4px 0}
.dy{border-bottom:1px solid #1a2130}.dy:last-child{border-bottom:0}
.dy summary{list-style:none;display:grid;grid-template-columns:110px 110px minmax(160px,1fr) minmax(0,1.4fr);gap:16px;align-items:center;padding:12px 16px;cursor:pointer}
.dy summary::-webkit-details-marker{display:none}
.dy summary:hover{background:#ffffff05}
.dy-d{font-size:13px;color:var(--mut)}.dy-d b{color:var(--fg)}
.hoy{margin-left:8px;font-size:10.5px;padding:1px 6px;border-radius:999px;background:#8B7CFF26;color:var(--brand)}

<script>
/* PROTOTIPO — datos simulados con la forma real de las cuotas del 1 oct 2026, 08:16. Nada se guarda. */
const ACC=[
 {id:'main',provider:'claude',cli:'Claude',alias:'main',c:'#8B7CFF',week:36,model:{n:'Fable',v:31},h5:6,reset:'sáb 3 oct, 08:00',left:'1d 23h',hoy:{h:2.1,tok:219,ses:7},sem:{h:24.6,tok:6.1,ses:58}},
 {id:'relotto',provider:'claude',cli:'Claude',alias:'relotto',c:'#FF9A5C',week:59,model:{n:'Fable',v:77},h5:27,reset:'vie 2 oct, 23:00',left:'1d 14h',hoy:{h:.6,tok:61,ses:2},sem:{h:11.2,tok:3.5,ses:23}},
 {id:'codex',provider:'codex',cli:'Codex',alias:'main',c:'#4CC2FF',week:53,model:null,h5:null,reset:'sáb 3 oct, 21:58',left:'2d 13h',hoy:{h:.4,tok:38,ses:1},sem:{h:7.9,tok:1.5,ses:14}},
 {id:'grok',provider:'grok',cli:'Grok',alias:'main',c:'#C5E35A',week:6,model:null,h5:null,reset:'sáb 3 oct, 20:54',left:'2d 12h',hoy:{h:0,tok:0,ses:0},sem:{h:6.5,tok:.2,ses:9}},
];
const PROJ=['Merauto','SAVA','NinjaCat','PaginasWeb','Chips','Relotto','DeepSearch','Dashboard','FerLongoria','signaraland','ComandOS','Signara'];
const DAYS=[['2026-10-01','jue','1 oct'],['2026-09-30','mié','30'],['2026-09-29','mar','29'],['2026-09-28','lun','28'],['2026-09-27','dom','27'],['2026-09-26','sáb','26'],['2026-09-25','vie','25'],['2026-09-24','jue','24']];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7),pick=a=>a[Math.floor(R()*a.length)];
const TODAYD='2026-10-01',NOWH=8.27;
const SES=[];
DAYS.slice(1).forEach(([d],i)=>{const n=[4,7,5,1,1,3,5][i];for(let k=0;k<n;k++){const x=R(),acc=x<.42?'main':x<.68?'relotto':x<.85?'codex':'grok';let st=pick([9.5,10,11.5,13,15,16.5,18,20,21.5,23,0.5,1.5])+R()*.6,du=.3+R()*2.1;if(st+du>23.9)du=23.9-st;SES.push({d,acc,proj:pick(PROJ),st,en:st+du})}});
const TODAY=[{acc:'main',proj:'DeepSearch',st:.12,en:.65},{acc:'relotto',proj:'Relotto',st:.7,en:1.3},{acc:'main',proj:'Dashboard',st:1.1,en:1.55},{acc:'codex',proj:'FerLongoria',st:1.5,en:1.92},{acc:'main',proj:'signaraland',st:1.6,en:2.25},{acc:'main',proj:'ComandOS',st:7.4,en:8.25}].map(s=>({...s,d:'2026-10-01'}));

let state='normal';
let accs=()=>ACC.map(a=>{a=structuredClone(a);if(state==='limite'&&a.id==='relotto'){a.week=94;a.model.v=98;a.h5=88}if(state==='vacio')a.hoy={h:0,tok:0,ses:0};return a});
let sessions=()=>state==='vacio'?SES:SES.concat(TODAY);
const A_=id=>ACC.find(a=>a.id===id);
const fmtH=h=>{let hh=Math.floor(h),mm=Math.round((h-hh)*60);if(mm===60){hh++;mm=0}return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')};
const dur=h=>!h?'—':h<1?Math.round(h*60)+' min':h.toFixed(1)+' h';
const lvl=q=>q<=10?'var(--bad)':q<=30?'var(--warn)':'var(--ok)';
let uid=0;

function flag(a){const q=100-a.week;return q<=10?'<span class="flag bad">casi vacía</span>':q<=30?'<span class="flag warn">queda poco</span>':''}
function stats(a){return `<div class="stats"><div><small>HOY</small><b>${dur(a.hoy.h)}</b><em>${a.hoy.ses} ses · ${a.hoy.tok}M tok</em></div><div><small>SEMANA</small><b>${dur(a.sem.h)}</b><em>${a.sem.ses} ses · ${a.sem.tok}B tok</em></div><div><small>RESET</small><b>${a.left}</b><em>${a.reset}</em></div></div>`}
function subs(a){const r=[];if(a.model)r.push([a.model.n,100-a.model.v]);if(a.h5!=null)r.push(['5 h',100-a.h5]);
 return r.length?`<div class="subs">${r.map(([n,q])=>`<div class="sub"><span>${n}</span><span class="tr" style="--fc:${q<=30?lvl(q):'var(--ac)'}"><i style="width:${q}%"></i></span><b>${q}%</b></div>`).join('')}</div>`:''}
function hero(a,lbl='queda esta semana'){return `<div class="hero"><div class="n num">${100-a.week}<sup>%</sup></div><div class="l">${lbl}</div></div>`}
function card(a,body,cls=''){return `<div class="card ${cls}" style="--ac:${a.c}"><div class="c-head"><span class="dot"></span><b>${a.cli}</b><small>${a.alias}</small>${flag(a)}</div>${body}${stats(a)}</div>`}

/* ---------- RONDA 3: botellas de vidrio ---------- */
function defs(id,c){return `<defs>
 <linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".95"/><stop offset="1" stop-color="${c}" stop-opacity=".6"/></linearGradient>
 <linearGradient id="${id}sh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
 <linearGradient id="${id}g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".12" stop-color="#fff" stop-opacity=".05"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset=".86" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
 <radialGradient id="${id}fl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <linearGradient id="${id}k" x1="0" x2="1"><stop offset="0" stop-color="#262d3d"/><stop offset=".45" stop-color="#3d4659"/><stop offset="1" stop-color="#1c2230"/></linearGradient>
 <linearGradient id="${id}cork" x1="0" x2="1"><stop offset="0" stop-color="#7a5232"/><stop offset=".5" stop-color="#b5814f"/><stop offset="1" stop-color="#6a4529"/></linearGradient></defs>`}
/* líquido con oleaje, burbujas y sombreado cilíndrico, recortado a la forma */
function liquid(id,path,W,H,yTop,yBot,q,c,period=60,amp=2.6){
 const y=yBot-(yBot-yTop)*q/100,n=Math.ceil((W+2*period)/(period/2));
 const wv=`M0 ${y} `+Array.from({length:n},(_,i)=>`q ${period/4} ${i%2?amp:-amp} ${period/2} 0`).join(' ')+` V ${H} H 0 Z`;
 const bub=q>6?[.3,.55,.7,.42].map((f,i)=>`<circle class="bub" cx="${W*f}" cy="${yBot-6}" r="${[1.6,1.1,2,1.3][i]}" fill="#fff" style="--rise:${-(yBot-y-10)}px;animation-delay:${i*1.1}s;animation-duration:${3.6+i*.7}s"/>`).join(''):'';
 return `<clipPath id="${id}c"><path d="${path}"/></clipPath><g clip-path="url(#${id}c)">
  <rect width="${W}" height="${H}" fill="#0b0f17"/>
  ${q>0?`<g class="wave" style="animation-duration:11s;--sh:${-period}px"><path d="${wv}" fill="${c}" opacity=".32" transform="translate(${-period/2},-2.5)"/></g>
  <g class="wave" style="--sh:${-period}px"><path d="${wv}" fill="url(#${id}l)"/></g>
  <rect x="0" y="${y-.6}" width="${W}" height="1.4" fill="#fff" opacity=".5"/>${bub}`:''}
  <rect width="${W}" height="${H}" fill="url(#${id}sh)"/></g>`;
}
function glass(id,path,W,hl){return `<path d="${path}" fill="url(#${id}g)" stroke="#ffffff42" stroke-width="1.3"/><path d="${path}" fill="none" stroke="#ffffff10" stroke-width="5"/>${hl||''}`}
function ticks(x,yTop,yBot,len=9){return [25,50,75].map(p=>{const y=yBot-(yBot-yTop)*p/100;return `<line x1="${x-len}" x2="${x}" y1="${y}" y2="${y}" stroke="#ffffff5c"/><text x="${x-len-4}" y="${y+3}" text-anchor="end" font-family="Ubuntu Sans Mono,monospace" font-size="8" fill="#ffffff70">${p}</text>`}).join('')}
const floor=(id,cx,y,rx)=>`<ellipse cx="${cx}" cy="${y}" rx="${rx}" ry="${rx*.13}" fill="url(#${id}fl)"/>`;

/* 1 · Botella de agua, alta, con etiqueta grabada */
function bWater(q,c,s=1,label=true){
 const id='w'+(uid++),W=120,H=232,path='M30 64 Q26 50 42 47 L78 47 Q94 50 90 64 L94 78 L94 206 Q94 220 80 220 L40 220 Q26 220 26 206 L26 78 Z';
 return `<svg viewBox="0 0 ${W} ${H}" width="${W*s}" height="${H*s}" role="img" aria-label="queda ${q} por ciento">${defs(id,c)}
 ${floor(id,60,224,46)}
 <rect x="38" y="8" width="44" height="30" rx="6" fill="url(#${id}k)"/>${[0,1,2,3,4,5,6].map(i=>`<rect x="${42+i*5.6}" y="12" width="2" height="22" rx="1" fill="#0008"/>`).join('')}
 <rect x="34" y="36" width="52" height="10" rx="3" fill="#1b2130"/>
 ${liquid(id,path,W,H,82,216,q,c,64)}
 ${glass(id,path,W,`<rect x="33" y="84" width="5" height="118" rx="2.5" fill="#fff" opacity=".2"/><rect x="41" y="96" width="2" height="60" rx="1" fill="#fff" opacity=".12"/>`)}
 ${label?ticks(90,82,216):''}
 </svg>`;
}
/* 2 · Matraz Erlenmeyer + tubos de ensayo */
function bFlask(q,c){
 const id='f'+(uid++),W=160,H=232,path='M64 26 L64 88 L20 198 Q14 214 32 214 L128 214 Q146 214 140 198 L96 88 L96 26 Z';
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="queda ${q} por ciento">${defs(id,c)}
 ${floor(id,80,218,66)}
 ${liquid(id,path,W,H,90,212,q,c,70,3)}
 ${glass(id,path,W,`<path d="M70 32 L70 92 L32 190" stroke="#fff" stroke-opacity=".22" stroke-width="3.5" fill="none" stroke-linecap="round"/>`)}
 <rect x="57" y="18" width="46" height="10" rx="4" fill="#ffffff1c" stroke="#ffffff45"/>
 ${[25,50,75].map(p=>{const y=212-(212-90)*p/100,hw=16+(y-88)*.4;return `<line x1="${80+hw-14}" x2="${80+hw}" y1="${y}" y2="${y}" stroke="#ffffff66"/><text x="${80+hw-18}" y="${y+3}" text-anchor="end" font-family="Ubuntu Sans Mono,monospace" font-size="8" fill="#ffffff80">${p}</text>`}).join('')}
 </svg>`;
}
function bTube(q,c,lab){
 const id='t'+(uid++),W=34,H=150,path='M6 14 L6 128 A11 11 0 0 0 28 128 L28 14 Z';
 return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${lab} queda ${q} por ciento">${defs(id,c)}
 ${liquid(id,path,W,H,22,139,q,c,24,1.6)}${glass(id,path,W,`<rect x="9" y="22" width="2.5" height="100" rx="1.2" fill="#fff" opacity=".22"/>`)}
 <rect x="2" y="9" width="30" height="7" rx="3" fill="#ffffff1c" stroke="#ffffff45"/></svg>`;
}
/* 3 · Frasco de poción con corcho y etiqueta colgante */

const TOKH={main:92,relotto:88,codex:64,grok:21}; /* M tok por hora, simulado */
function usedFor(a){return a.weekUsed===undefined?a.week:a.weekUsed}
function costData(){const as=accs(),ss=sessions();const hAcc={};ss.forEach(s=>hAcc[s.acc]=(hAcc[s.acc]||0)+s.en-s.st);
 const P={};ss.forEach(s=>{const h=s.en-s.st,p=P[s.proj]=P[s.proj]||{p:s.proj,h:0,tok:0,acc:{}};p.h+=h;p.tok+=s.tok;const a=p.acc[s.acc]=p.acc[s.acc]||{h:0,tok:0,q:0};a.h+=h;a.tok+=s.tok;a.q+=h/hAcc[s.acc]*(usedFor(as.find(x=>x.id===s.acc))||0)});
 return Object.values(P).sort((a,b)=>b.tok-a.tok)}
const LAST=(()=>{const r=rng(5),o={};PROJ.forEach(p=>o[p]=r()<.25?0:+(r()*7).toFixed(1));o.SAVA=1.2;o.Chips=5.1;o.Dashboard=3.0;return o})();
const WASTE=[{id:'main',cyc:[4,0,9,6]},{id:'relotto',cyc:[2,11,0,5]},{id:'codex',cyc:[53,61,40,48]},{id:'grok',cyc:[88,92,79,95]}];
const fmtTok=t=>t>=1000?(t/1000).toFixed(1)+'B':Math.round(t)+'M';
function franjas(){const F=[['Madrugada',0,6],['Mañana',6,12],['Tarde',12,18],['Noche',18,24]];
 return F.map(([n,a,b])=>{let h=0;const pr={};sessions().forEach(s=>{const o=Math.max(0,Math.min(s.en,b)-Math.max(s.st,a));if(o>0){h+=o;pr[s.proj]=(pr[s.proj]||0)+o}});return {n,a,b,h,top:Object.entries(pr).sort((x,y)=>y[1]-x[1]).slice(0,3)}})}
function vsWeek(){const cur={};sessions().forEach(s=>cur[s.proj]=(cur[s.proj]||0)+s.en-s.st);const all=new Set([...Object.keys(cur),...Object.keys(LAST)]);
 const rows=[...all].map(p=>({p,now:cur[p]||0,prev:LAST[p]||0,d:(cur[p]||0)-(LAST[p]||0)})).filter(r=>r.now||r.prev).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
 const tn=rows.reduce((x,r)=>x+r.now,0),tp=rows.reduce((x,r)=>x+r.prev,0);return {rows,tn,tp}}
const sgn=d=>d>0.05?`<b class="up">▲ ${dur(d)}</b>`:d<-0.05?`<b class="dn">▼ ${dur(-d)}</b>`:'<b class="eq">=</b>';
function accSeg(p,total='tok'){return Object.entries(p.acc).sort((a,b)=>b[1][total]-a[1][total]).map(([id,v])=>`<i style="--ac:${A_(id).c};flex:${v[total]}" data-tip="${p.p} · ${accName(id)}|${v.q.toFixed(1)}% de la semana de ${accName(id)}|${dur(v.h)} · ${fmtTok(v.tok)} tok"></i>`).join('')}
function quotaChips(p){return Object.entries(p.acc).sort((a,b)=>b[1].q-a[1].q).map(([id,v])=>`<span class="qc" style="--ac:${A_(id).c}">${v.q.toFixed(1)}% <em>${A_(id).cli} ${A_(id).alias}</em></span>`).join('')}

/* paneles reutilizables */
function pWaste(compact){return `<div class="panel"><h5>Cuota que se quedó sin usar</h5><p class="ph">Lo que quedaba en cada cuenta cuando se renovó la semana. Mucho sobrante = esa cuenta te sobra.</p>
 ${WASTE.map(w=>{const a=A_(w.id),last=w.cyc[0];return `<div class="wr"><span class="wn"><span class="dot" style="background:${a.c}"></span>${a.cli} ${a.alias}</span><span class="wbar"><i style="width:${100-last}%;--ac:${a.c}"></i><u style="width:${last}%"></u></span><b class="${last>=40?'warnT':''}">${last}%</b>${compact?'':`<span class="wh">${w.cyc.slice().reverse().map((c,i)=>`<i style="height:${Math.max(6,c)}%" title="hace ${4-i} semanas: ${c}% sin usar"></i>`).join('')}</span>`}</div>`}).join('')}
 <div class="pfoot">Codex y Grok desperdician la mitad o más casi cada semana; Claude main se agota.</div></div>`}
function pVs(){const v=vsWeek(),d=v.tn-v.tp;return `<div class="panel"><h5>Esta semana vs la pasada</h5>
 <div class="vsbig"><div><small>Esta semana</small><b>${dur(v.tn)}</b></div><div><small>La pasada</small><b>${dur(v.tp)}</b></div><div><small>Diferencia</small>${sgn(d)}</div></div>

 ${cd.slice(0,7).map(p=>`<div class="mx"><span>${p.p}</span><span class="mxb">${Object.entries(p.acc).sort((a,b)=>b[1].h-a[1].h).map(([id,v])=>`<i style="--ac:${A_(id).c};flex:${v.h}" data-tip="${p.p}|${Math.round(v.h/p.h*100)}% en ${accName(id)}|${dur(v.h)}">${v.h/p.h>=.2?Math.round(v.h/p.h*100)+'%':''}</i>`).join('')}</span></div>`).join('')}</div>`}
function pHour(){const F=franjas(),mx=Math.max(...F.map(f=>f.h),1);return `<div class="panel"><h5>¿A qué hora trabajas?</h5>

/* P1 · Ranking + paneles */
function P1(){const cd=costData(),mx=cd[0]?cd[0].tok:1;
 return `<div class="cmp1"><div class="panel big"><h5>¿Qué proyecto cuesta más?</h5><p class="ph">Ordenado por tokens de la semana. La barra se reparte por cuenta y cada chip dice qué % de la semana de esa cuenta se comió.</p>
 ${cd.map((p,i)=>`<div class="rk"><span class="rn">${i+1}</span><div class="rb"><div class="rt"><b>${p.p}</b><span>${fmtTok(p.tok)} tok · ${dur(p.h)}</span></div><div class="rbar" style="width:${p.tok/mx*100}%">${accSeg(p)}</div><div class="qcs">${quotaChips(p)}</div></div></div>`).join('')}</div>
 <div class="side3">${pWaste(true)}${pVs()}${pHour()}</div></div>${pMix(cd)}`}
/* P2 · Mapa de árbol */
function treemap(items,W,H){/* squarified simple: filas */const tot=items.reduce((x,i)=>x+i.v,0);let x=0,y=0,w=W,h=H;const out=[];let rest=items.slice();
 while(rest.length){const horiz=w>=h;const side=horiz?h:w;let row=[],best=Infinity;for(const it of rest){const r=[...row,it],s=r.reduce((a,b)=>a+b.v,0)/tot*W*H,len=s/side,worst=Math.max(...r.map(q=>{const a=q.v/tot*W*H,o=a/len;return Math.max(o/len,len/o)}));if(worst<=best){row=r;best=worst}else break}
  const s=row.reduce((a,b)=>a+b.v,0)/tot*W*H,len=s/side;let o=0;row.forEach(it=>{const a=it.v/tot*W*H,l=a/len;out.push(horiz?{...it,x,y:y+o,w:len,h:l}:{...it,x:x+o,y,w:l,h:len});o+=l});
  if(horiz){x+=len;w-=len}else{y+=len;h-=len}rest=rest.slice(row.length)}return out}
function P2(){const cd=costData(),W=1000,H=360;const tm=treemap(cd.map(p=>({...p,v:p.tok})),W,H);
 return `<div class="panel"><h5>¿Qué proyecto cuesta más?</h5><p class="ph">Cada rectángulo es un proyecto; su tamaño es lo que gastó en tokens esta semana. El color es la cuenta que más lo trabajó.</p>
 <div class="tm" style="aspect-ratio:${W}/${H}">${tm.map(r=>{const top=Object.entries(r.acc).sort((a,b)=>b[1].tok-a[1].tok)[0][0];return `<div class="tmc" style="left:${r.x/W*100}%;top:${r.y/H*100}%;width:${r.w/W*100}%;height:${r.h/H*100}%;--ac:${A_(top).c}" data-tip="${r.p}|${fmtTok(r.tok)} tok · ${dur(r.h)}|${Object.entries(r.acc).map(([id,v])=>v.q.toFixed(1)+'% de '+accName(id)).join(' · ')}"><div>${r.w>90&&r.h>40?`<b>${r.p}</b><span>${fmtTok(r.tok)} tok</span>`:r.w>50&&r.h>22?`<b class="s">${r.p}</b>`:''}</div></div>`}).join('')}</div></div>
 <div class="grid4">${pWaste()}${pVs()}${pMix(cd)}${pHour()}</div>`}
/* P3 · Matriz proyecto × cuenta */
function P3(){const cd=costData(),as=ACC;const mxq=Math.max(...cd.flatMap(p=>Object.values(p.acc).map(v=>v.q)),1);
 return `<div class="panel"><h5>¿Qué proyecto cuesta más, y en qué cuenta?</h5><p class="ph">Cada celda: qué % de la semana de esa cuenta se comió el proyecto. Más intenso = más caro. Ordenado por tokens.</p>
 <div class="mtx-wrap"><table class="mtx"><thead><tr><th>Proyecto</th>${as.map(a=>`<th><span class="dot" style="background:${a.c}"></span>${a.cli} ${a.alias}</th>`).join('')}<th class="r">Tokens</th><th class="r">Horas</th><th class="r">vs pasada</th></tr></thead><tbody>
 ${cd.map(p=>`<tr><td><b>${p.p}</b></td>${as.map(a=>{const v=p.acc[a.id];return v?`<td class="hc" style="--ac:${a.c};--a:${.15+.85*v.q/mxq}">${v.q.toFixed(1)}%</td>`:'<td class="hc0">·</td>'}).join('')}<td class="r mono">${fmtTok(p.tok)}</td><td class="r mono">${dur(p.h)}</td><td class="r">${sgn(p.h-(LAST[p.p]||0))}</td></tr>`).join('')}
 <tr class="tot"><td>Sin usar al último reset</td>${WASTE.map(w=>`<td class="${w.cyc[0]>=40?'warnT':''}">${w.cyc[0]}%</td>`).join('')}<td></td><td></td><td></td></tr></tbody></table></div></div>
 <div class="grid2">${pVs()}${pHour()}</div>`}
/* P4 · Hallazgos en tarjetas */
function P4(){const cd=costData(),top=cd[0],v=vsWeek(),F=franjas().sort((a,b)=>b.h-a.h)[0],WW=WASTE.filter(x=>x.cyc.length).sort((a,b)=>b.cyc[0]-a.cyc[0]),w=WW[0],up=v.rows.filter(r=>r.d>0)[0],mixP=cd.find(p=>Object.keys(p.acc).length>1);
 const card=(k,title,body,viz)=>`<div class="ins"><span class="ik">${k}</span><h6>${title}</h6><p>${body}</p>${viz}</div>`;
 const topAcc=top?Object.entries(top.acc).sort((a,b)=>b[1].q-a[1].q)[0]:null;
 return `<div class="ins-grid">
 ${top?card('Lo más caro',`${top.p} se comió ${topAcc[1].q.toFixed(0)}% de la semana de ${accName(topAcc[0])}`,`${fmtTok(top.tok)} tokens en ${dur(top.h)}. Le siguen ${cd.slice(1,3).map(p=>p.p).join(' y ')}.`,`<div class="rbar wide">${accSeg(top)}</div><div class="mini-rank">${cd.slice(0,5).map(p=>`<div><span>${p.p}</span><i style="width:${p.tok/top.tok*100}%"></i><b>${fmtTok(p.tok)}</b></div>`).join('')}</div>`):''}
 ${card('Cuota que sobra',`${accName(w.id)} dejó ${w.cyc[0]}% sin usar`,`Pasa casi cada semana (${w.cyc.join('%, ')}%). Podrías mandarle más trabajo antes de que se renueve.`,`<span class="wh big">${w.cyc.slice().reverse().map(c=>`<i style="height:${Math.max(6,c)}%;background:${A_(w.id).c}"></i>`).join('')}</span>`)}

   const en=st+(act+pause)/60;const proj=s?s.proj:PROJ[k];const ag={};base.filter(x=>x.d===d&&x.proj===proj).forEach(x=>{const o=Math.max(0,Math.min(x.en,en)-Math.max(x.st,st));if(o>0)ag[x.acc]=(ag[x.acc]||0)+Math.round(o*60)});
   out.push({d,st,en,plan,act,pause,status:canc?'cancelado':'completado',proj,ag})}});out.sort((a,b)=>(a.d+a.st)<(b.d+b.st)?-1:1);for(let i=1;i<out.length;i++){const p=out[i-1],c=out[i];if(c.d===p.d&&c.st<p.en+.05){const sh=p.en+.08-c.st;c.st+=sh;c.en+=sh}}return out.sort((a,b)=>(a.d+a.st)<(b.d+b.st)?-1:1)})();

function fstats(fs){const done=fs.filter(f=>f.status==='completado'),min=fs.reduce((x,f)=>x+f.act,0),plan=fs.reduce((x,f)=>x+f.plan,0),pause=fs.reduce((x,f)=>x+f.pause,0);
 const days=[...new Set(done.map(f=>f.d))].sort();let streak=0;for(const [d] of DAYS){if(done.some(f=>f.d===d))streak++;else if(d!==TODAYD)break}
 return {n:fs.length,done:done.length,canc:fs.length-done.length,min,plan,pause,pct:fs.length?Math.round(done.length/fs.length*100):0,streak,agent:fs.reduce((x,f)=>x+Object.values(f.ag).reduce((a,b)=>a+b,0),0)}}

let phone=false,phoneDay=5; /* índice del primer día visible en el calendario de 3 días */
const isPhone=()=>phone||innerWidth<600;
/* calendario: en celular, 3 días con flechas */
function calendarCuentas(){if(!isPhone())return K1();const days=CHRONO.slice(phoneDay,phoneDay+3);
 const saved=CHRONO.slice();CHRONO.splice(0,CHRONO.length,...days);const html=K1();CHRONO.splice(0,CHRONO.length,...saved);
 return `<div class="pnav"><button data-pd="-1" ${phoneDay<=0?'disabled':''} aria-label="Días anteriores">←</button><span>${days.map(d=>d[1]+' '+d[2]).join(' · ')}</span><button data-pd="1" ${phoneDay>=CHRONO.length-3?'disabled':''} aria-label="Días siguientes">→</button></div>`+html}
/* pomodoro en celular: tarjetas en vez de tabla */
function pomodoroPhone(){const fs=focusAll();return pnums(fs)+`<div class="pcards1">${DAYS.map(([d,wd,dd])=>{const m=fs.filter(f=>f.d===d),ok=m.filter(f=>f.status==='completado');const pr={};ok.forEach(f=>pr[f.proj]=(pr[f.proj]||0)+1);
 return `<div class="pc1 ${d===TODAYD?'today':''}"><div class="pc1h"><span><b>${wd}</b> ${dd}</span><span class="ptoms">${m.map(f=>tomato(f.status==='completado',18,f.proj)).join('')}</span><b class="pc1n">${ok.length}</b></div>${m.length?`<div>${m.map(f=>`<span class="hchip ${f.status==='completado'?'':'x'}">${fmtH(f.st)}</span>`).join('')}</div><div class="pc1p">${Object.entries(pr).map(([p,n])=>`<span class="pc" style="--ac:${projColor(p)}">${p} <b>${n}</b></span>`).join(' ')}</div><div class="pc1f mono">${fmin(m.reduce((x,f)=>x+f.act,0))} de foco</div>`:'<div class="dim">sin pomodoros</div>'}</div>`}).join('')}</div>`+pPerHour(fs)+`<div style="margin-top:14px">${pPerProj(fs)}</div>`}
const TABS=[['cuentas','Cuentas'],['comparar','Comparar'],['pomodoro','Pomodoro']];
let tab='cuentas';
const STATES=[['normal','Normal'],['pesada','Semana pesada'],['vacio','Hoy sin actividad'],['limite','relotto casi vacía']];
function body(){const as=accs();
 if(tab==='cuentas')return (WK?'<div class="wk-note" style="margin:0 0 8px">Las botellas muestran tu cuota de ahora; el calendario es de la semana que elegiste.</div>':'')+barShelf(as)+`<div class="sect"><h3>${WK?'Semana':'Esta semana'}</h3><span>${weekLabel()}</span></div>`+calendarCuentas();
 if(tab==='comparar')return C1();
 return isPhone()?pomodoroPhone():S5()}
function draw(){
 const m=document.getElementById('modal');uid=0;m.classList.toggle('phone',isPhone());document.querySelector('.app').classList.toggle('phone-frame',phone);
 m.innerHTML=`<div class="mhead"><h2>Analytics</h2><div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join('')}</div>
  <div class="wnav"><button data-w="-1" ${WK<=-1?'disabled':''} aria-label="Semana anterior">←</button><span>${WK?'Semana':'Esta semana'} · <b>${weekLabel()}</b></span><button data-w="1" ${WK>=0?'disabled':''} aria-label="Semana siguiente">→</button></div></div>${body()}`;
 m.innerHTML=m.innerHTML.replaceAll('🍅',`<span class="tin">${tomato(true,16)}</span>`);
 m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});
 m.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{setWeek(WK+ +b.dataset.w);draw()});
 m.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{phoneDay=Math.max(0,Math.min(CHRONO.length-3,phoneDay+ +b.dataset.pd));draw()});
 m.querySelectorAll('[data-pop]').forEach(b=>b.onclick=e=>{e.stopPropagation();const pop=document.getElementById('pop');const rows=JSON.parse(decodeURIComponent(b.dataset.pop));pop.innerHTML=`<h6>${b.dataset.title}</h6>`+rows.map(r=>`<div><span class="dot" style="background:${r[3]}"></span><b>${r[1]}</b><span>${r[0]}</span><em>${r[2]}</em></div>`).join('');pop.hidden=false;const rc=b.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(innerWidth-pop.offsetWidth-10,rc.right+8))+'px';pop.style.top=Math.min(innerHeight-pop.offsetHeight-10,rc.top)+'px'});
 if(isPhone())m.querySelectorAll('.bar-row').forEach(row=>{const n=row.children.length;const dots=document.createElement('div');dots.className='sdots';dots.innerHTML=Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join('');row.closest('.bar').after(dots);row.addEventListener('scroll',()=>{const i=Math.round(row.scrollLeft/row.clientWidth);dots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===i))},{passive:true})});
 document.getElementById('states').innerHTML=STATES.map(([k,l])=>`<button class="${k===state?'on':''}" data-st="${k}">${l}</button>`).join('')+`<button class="${phone?'on':''}" data-ph>${phone?'Vista celular ✓':'Vista celular'}</button>`;
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{state=b.dataset.st;draw()});
 document.querySelector('[data-ph]').onclick=()=>{phone=!phone;draw()};
 try{localStorage.setItem('anM-tab',tab)}catch(e){}
}

(()=>{const t=document.getElementById('tip');document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(!el){t.hidden=true;return}const [a,b,c]=el.dataset.tip.split('|');t.innerHTML=`<b>${b}</b><span>${a}</span><em>${c}</em>`;t.hidden=false});document.addEventListener('pointermove',e=>{if(t.hidden)return;const x=Math.min(innerWidth-t.offsetWidth-8,e.clientX+14),y=e.clientY+18+t.offsetHeight>innerHeight?e.clientY-t.offsetHeight-10:e.clientY+18;t.style.left=x+'px';t.style.top=y+'px'})})();
document.addEventListener('click',e=>{if(!e.target.closest('#pop'))document.getElementById('pop').hidden=true});

addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,[contenteditable]'))return;const i=TABS.findIndex(t=>t[0]===tab);if(e.key==='ArrowLeft'){tab=TABS[(i+2)%3][0];draw()}if(e.key==='ArrowRight'){tab=TABS[(i+1)%3][0];draw()}});
(()=>{const p=document.getElementById('picker'),g=document.getElementById('grip');let sx=null,sy,ox,oy;g.addEventListener('pointerdown',e=>{const r=p.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;g.setPointerCapture(e.pointerId)});g.addEventListener('pointermove',e=>{if(sx==null)return;p.style.left=Math.max(0,ox+e.clientX-sx)+'px';p.style.top=Math.max(0,oy+e.clientY-sy)+'px';p.style.right='auto';p.style.bottom='auto'});g.addEventListener('pointerup',()=>sx=null)})();
try{const t=localStorage.getItem('anM-tab');if(t&&TABS.some(x=>x[0]===t))tab=t}catch(e){}
draw();
</script>
