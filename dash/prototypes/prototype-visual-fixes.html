const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const variants=[{id:'A',name:'Mosaico compacto',short:'Mosaico',note:'Mi recomendación. Escritorio familiar y rejilla de altura limitada. En móvil, “Sesiones” abre una pantalla completa; elegir una devuelve toda la altura a la terminal.'},{id:'B',name:'Sesiones a la izquierda',short:'Lista lateral',note:'La lista vive en la columna izquierda; el uso de cuentas es otra pestaña. Ganas altura para trabajar, a cambio de cambiar entre Uso y Sesiones.'},{id:'C',name:'Selector bajo demanda',short:'Selector',note:'Una cabecera mínima y una ventana de búsqueda para cambiar de sesión. En móvil se abre una hoja amplia; al elegir se cierra. La terminal ocupa casi todo.'},{id:'D',name:'Sesiones por estado',short:'Por estado',note:'Trabajando, esperando y terminadas en bandas separadas. Útil con muchas sesiones. En móvil los grupos viven en una pantalla exclusiva con regreso visible.'},{id:'E',name:'Vista de espacios',short:'Espacios',note:'“Todas” sustituye la terminal por un tablero de sesiones. Cada tarjeta abre su espacio. Prioriza encontrar una sesión sin apilar el tablero encima de la terminal.'}];
const base=['Local','signaraland','Banda','0xAI Website','Relotto','Merauto','NinjaCatBot','FerLongoria','NinjaCat','MRP','Ventas','blocka… → nombre completo','ComandOS','LimpiezaDigital','RWAairbnb','CryptoWalk','Cobbler','PaginasWeb','SAVA','Proyecto de catálogo y documentación'];
const query=new URLSearchParams(location.search);let state={variant:variants.some(v=>v.id===query.get('variant'))?query.get('variant'):'A',phone:query.get('device')==='phone'||innerWidth<760,count:20,active:12,focus:1,all:false,notice:true,quick:false,modal:'',side:'sessions',filter:'',status:'all',split:44};
function sessions(){return Array.from({length:state.count},(_,i)=>({id:i,name:base[i]||`Proyecto ${String(i+1).padStart(3,'0')} · desarrollo`,model:i===0?'Shell':i%4===0?'opus-4.5':i%3===0?'gpt-6-astra':'gpt-6.1-sol',status:i===0?'idle':i%4===0?'wait':i%3===0?'done':'work'}));}
function current(){return sessions()[state.active]||sessions()[0]}
function visible(){return sessions().filter(s=>(state.status==='all'||s.status===state.status)&&s.name.toLowerCase().includes(state.filter.toLowerCase()))}
function card(s){return `<button class="session ${s.id===state.active?'active':''}" data-action="session" data-id="${s.id}" aria-label="Abrir ${esc(s.name)}"><span class="dot ${s.status}"></span><span class="session-name">${esc(s.name)}</span><span class="session-model">${esc(s.model)}</span><span class="status-icon">${icon(s.status==='done'?'check':s.status==='wait'?'clock':'right')}</span></button>`}
function filter(){return `<div class="filter-row"><input data-search value="${esc(state.filter)}" placeholder="Buscar sesión…" aria-label="Buscar sesión"><small>${visible().length} sesiones</small></div>`}
function groups(){return ['work','wait','done'].map((key,i)=>`<section class="band"><h3>${['Trabajando','Esperando respuesta','Terminadas'][i]} · ${visible().filter(s=>(s.status===key||key==='work'&&s.status==='idle')).length}</h3>${visible().filter(s=>(s.status===key||key==='work'&&s.status==='idle')).map(card).join('')}</section>`).join('')}
function usage(){return `<div class="usage"><h2>Uso de tus cuentas</h2>${[['Claude','main',36],['Claude','relotto',82],['Codex','main',31],['Grok','main',18],['Antigravity','main',15]].map(([n,a,p])=>`<section class="usage-card ${p>80?'warn':''}"><div class="usage-name"><span class="provider">${icon(n==='Claude'?'spark':'terminal')}</span><div><strong>${n}</strong><small>${a}</small></div><b>${p}%</b></div><div class="bar"><span style="width:${p}%"></span></div><p><span>SEMANA</span><span>Se reinicia en ${p>80?'23 h':'5 días'}</span></p></section>`).join('')}</div>`}
function notice(){return state.notice?`<div class="notice"><span class="notice-icon">${icon('check')}</span><div><strong>Codex terminó</strong><small>LimpiezaDigital · hace un momento</small><button class="notice-open" data-action="notice-open">Abrir sesión ${icon('right')}</button></div><button class="notice-close" data-action="notice" aria-label="Cerrar aviso">${icon('close')}</button></div>`:''}
function sidebar(){return `<aside class="sidebar"><div class="tools">${ib('panel','panel','Panel de cuentas')}${ib('server','servers','Servidores')}${ib('bell','notice','Avisos')}<span class="grow"></span><button class="timer" data-action="pomo" title="Pomodoro">${icon('timer')}<span>25:00</span></button>${ib('settings','settings','Ajustes')}</div>${state.variant==='B'?`<div class="side-tabs"><button data-action="side" data-value="sessions" class="${state.side==='sessions'?'selected':''}">Sesiones · ${state.count}</button><button data-action="side" data-value="usage" class="${state.side==='usage'?'selected':''}">Uso de cuentas</button></div>${state.side==='sessions'?`<div class="side-sessions">${filter()}${visible().map(card).join('')}</div>`:usage()}`:`<div class="side-tabs"><button class="selected" data-action="commands">Comandos</button><button data-action="chains">Cadenas</button><button data-action="servers">Servidores</button></div>${usage()}`}${notice()}${state.quick?`<div class="quick-panel"><div class="quick-title">${icon('terminal')} Terminal local <span class="grow"></span><button data-action="quick" title="Ocultar terminal lateral">${icon('hide')} Ocultar</button></div><pre>~/ComandOS  git:(main)\n<span style="color:var(--accent)">❯</span> <span class="cursor"></span></pre></div>`:`<div class="quick-closed">${icon('terminal')} Terminal lateral <button data-action="quick">Mostrar ${icon('up')}</button></div>`}<footer class="side-footer">${state.variant!=='C'&&state.variant!=='B'?`${icon('clock')} 18:02 <span class="muted">·</span> Jue 8 oct`:'ComandOS'}<span class="grow"></span><span class="dot"></span> Conectado</footer></aside>`}
function header(){const s=current();return `<div class="workspace-head">${ib('left','prev','Sesión anterior')}${state.phone||['B','C','D','E'].includes(state.variant)?`<button class="current" data-action="all"><span class="dot ${s.status}"></span><span>${esc(s.name)}</span>${icon('down')}</button>`:`<div class="compact-tabs">${sessions().slice(Math.max(0,state.active-2),Math.max(0,state.active-2)+5).map(t=>`<button class="${t.id===state.active?'active-tab':''}" data-action="session" data-id="${t.id}"><span class="dot ${t.status}"></span>${esc(t.name)}</button>`).join('')}</div>`}${ib('right','next','Sesión siguiente')}<span class="grow ${state.phone?'desktop-only':''}"></span><button class="all-toggle" data-action="all">${icon(state.variant==='B'?'list':'grid')}<span>${state.phone?'Sesiones':state.variant==='E'?'Espacios':'Todas'} <span class="muted">${state.count}</span></span></button><span class="tab-actions desktop-only">${ib('plus','new','Nueva sesión')}${ib('sort','sort','Ordenar sesiones')}</span>${state.phone?ib('timer','pomo','Pomodoro'):''}</div>`}
function terminal(p){const s=current();return `<section class="terminal ${state.focus===p?'focused':''}" tabindex="0" data-pane="${p}" aria-label="Split ${p+1}"><div class="terminal-head"><span class="dot ${p===0?'':'wait'}"></span><b>${p===0?'Terminal local':esc(s.name)}</b><span class="model">${p===0?'zsh':esc(s.model)}</span><span class="grow"></span>${p===1?`<button data-action="account">${icon('user')} main</button><button data-action="extensions" title="MCPs y Skills">${icon('spark')}</button>`:''}</div><div class="terminal-body">${p===0?`<p><span class="prompt">❯</span> ComandOS <span class="comment">git:(main)</span></p><p><span class="prompt">❯</span> git status<br><span class="comment">On branch main<br>Your branch is up to date.</span></p><p><span class="ok">Working tree clean</span></p><p><span class="prompt">❯</span> <span class="cursor"></span></p>`:`<h3><span class="prompt">›</span> Revisemos los cambios del proyecto.</h3><p>Los cambios están preparados para revisión.</p><p><span class="ok">✓</span> Navegación de sesiones<br><span class="ok">✓</span> Vista de escritorio<br><span class="ok">✓</span> Acceso remoto</p><p class="comment">Trabajó durante 38 s</p><p><span class="prompt">›</span> Escribe tu siguiente instrucción <span class="cursor"></span></p><p class="comment">${esc(s.model)} · ~/proyectos/${esc(s.name)}<br>? para ver atajos</p>`}</div></section>`}
function overview(){return `<div class="overview"><h1>Tus espacios</h1><p>${state.count} sesiones · selecciona una para entrar a su terminal</p>${filter()}<div class="overview-grid">${visible().map(s=>`<button class="preview-card ${s.id===state.active?'active':''}" data-action="session" data-id="${s.id}"><span class="card-title"><span class="dot ${s.status}"></span><b>${esc(s.name)}</b></span><small>${esc(s.model)}</small><pre>${s.status==='done'?'✓ Cambios listos para revisar':s.status==='wait'?'› Esperando tu respuesta':'❯ Sesión en curso'}<br>…</pre><span class="open-link">Abrir terminal ${icon('right')}</span></button>`).join('')}</div></div>`}
function chooser(){let list=state.variant==='D'?groups():`<div class="session-grid">${visible().map(card).join('')}</div>`;return `<div class="overlay" data-backdrop="chooser"><section class="chooser" role="dialog" aria-modal="true" aria-label="Todas las sesiones"><header class="chooser-head"><div><h2>${state.variant==='D'?'Sesiones por estado':'Todas las sesiones'}</h2><p>${state.count} disponibles · selecciona una para abrirla</p></div><span class="grow"></span>${ib('close','close-all','Volver a la terminal')}</header><div class="chooser-tools"><input data-search value="${esc(state.filter)}" placeholder="Buscar por nombre…" aria-label="Buscar por nombre">${ib('sort','sort','Ordenar sesiones')}</div><div class="chooser-list">${visible().length?list:'<div class="empty">No hay sesiones con ese nombre.</div>'}</div><footer class="chooser-foot"><span>Actual: ${esc(current().name)}</span><button data-action="close-all">${icon('left')} Volver a terminal</button></footer></section></div>`}
function mini(){return `<div class="overlay mini-overlay" data-backdrop="modal"><section class="mini-modal" role="dialog" aria-modal="true"><div class="modal-title"><h2>${state.modal==='pomo'?'Pomodoro':esc(state.modal)}</h2>${ib('close','close-modal','Cerrar')}</div>${state.modal==='pomo'?`<div class="timer-value">25:00</div><button class="primary" data-action="start-pomo">${icon('timer')} Iniciar enfoque</button><p>Icono estático. El progreso se comunica con el tiempo restante.</p>`:`<p>Este panel muestra la entrada al control. El contenido detallado se revisará en la siguiente ronda.</p><button class="solid" data-action="close-modal">Volver</button>`}</section></div>`}
function render(){const v=variants.find(v=>v.id===state.variant),app=document.getElementById('app');app.className=`surface ${state.phone?'phone':''} variant-${state.variant}`;app.style.setProperty('--split',state.split+'%');const overviewOn=state.variant==='E'&&state.all;let top='';if(state.variant==='A'&&state.all&&!state.phone)top=`<div class="inline-sessions">${filter()}<div class="session-grid">${visible().map(card).join('')}</div></div>`;if(state.variant==='D'&&!state.phone)top=`<div class="state-tabs"><button data-action="status" data-value="all">Todas · ${state.count}</button><button data-action="status" data-value="work">Trabajando</button><button data-action="status" data-value="wait">Esperando</button><button data-action="status" data-value="done">Terminadas</button></div>${state.all?`<div class="bands">${groups()}</div>`:''}`;app.innerHTML=`<div class="titlebar"><span class="brand-dot"></span>COMANDOS<span class="grow"></span>${state.variant==='B'?'<span class="muted">18:02</span>':''}<span class="window-keys">─　□　×</span></div><div class="body">${sidebar()}<main class="workspace">${header()}${overviewOn?overview():`${top}<div class="panes">${terminal(0)}<div class="dragbar" id="splitter" role="separator" aria-label="Redimensionar splits"></div>${terminal(1)}</div><div class="mobile-keys"><button data-action="key" data-value="Esc">Esc</button><button data-action="key" data-value="Ctrl+C">Ctrl+C</button><button class="confirm" data-action="key" data-value="Sí">Sí</button><button class="decline" data-action="key" data-value="No">No</button><button data-action="key" data-value="Seleccionar">Seleccionar</button></div><footer class="workspace-footer"><span class="dot"></span>${state.phone?'Remoto conectado':'Sesión conectada'}<span class="grow"></span>${state.variant==='D'?'<span>18:02 · CDMX</span>':`<span>${state.active+1} de ${state.count} sesiones</span>`}</footer>`}</main></div>${state.all&&!overviewOn&&(state.phone||state.variant==='C')?chooser():''}${state.modal?mini():''}`;app.querySelector('[data-action="prev"]').disabled=state.active===0;app.querySelector('[data-action="next"]').disabled=state.active===state.count-1;document.getElementById('variant-title').textContent=`${v.id} · ${v.name}`;document.getElementById('variant-note').textContent=v.note;document.getElementById('variants').innerHTML=variants.map(x=>`<button data-action="variant" data-value="${x.id}" class="${x.id===v.id?'on':''}">${x.id} · ${x.short}</button>`).join('');document.getElementById('desktop-mode').classList.toggle('selected',!state.phone);document.getElementById('phone-mode').classList.toggle('selected',state.phone);document.getElementById('session-count').value=state.count;updateState();const url=new URL(location);url.searchParams.set('variant',state.variant);url.searchParams.set('device',state.phone?'phone':'desktop');history.replaceState(null,'',url);}
function updateState(extra=''){document.getElementById('demo-state').textContent=`Ronda 1 · ${state.phone?'Móvil':'Escritorio'} · ${state.count} sesiones · ${current().name} · split ${state.focus+1} · ${state.all?'selector abierto':'terminal'}${extra?' · '+extra:''} · SIMULADO`}
function choose(id){state.active=id;state.focus=1;state.filter='';state.status='all';if(state.phone||['C','E'].includes(state.variant))state.all=false;state.modal='';render()}
function toggleAll(){state.all=!state.all;state.filter='';state.status='all';if(state.variant==='B'&&!state.phone){state.side='sessions';state.all=false}render()}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button){const pane=e.target.closest('[data-pane]');if(pane){state.focus=+pane.dataset.pane;document.querySelectorAll('.terminal').forEach(n=>n.classList.toggle('focused',+n.dataset.pane===state.focus));updateState()}if(e.target.dataset.backdrop){if(e.target.dataset.backdrop==='chooser')state.all=false;else state.modal='';render()}return}const a=button.dataset.action,value=button.dataset.value;if(a==='variant'||a==='variant-step'){const i=variants.findIndex(v=>v.id===state.variant);state.variant=a==='variant'?value:variants[(i+Number(value)+5)%5].id;state.all=!state.phone&&['A','D','E'].includes(state.variant);state.modal='';state.filter='';state.status='all';render();return}if(a==='device'){state.phone=value==='phone';state.all=false;state.modal='';render();return}if(a==='all'){toggleAll();return}if(a==='session'){choose(+button.dataset.id);return}if(a==='prev'||a==='next'){choose(Math.max(0,Math.min(state.count-1,state.active+(a==='prev'?-1:1))));return}if(a==='close-all'){state.all=false;render();return}if(a==='notice-open'){state.notice=false;choose(13);return}if(a==='notice'){state.notice=!state.notice;render();return}if(a==='quick'){state.quick=!state.quick;render();return}if(a==='side'){state.side=value;render();return}if(a==='status'){state.status=value;state.all=true;render();return}if(a==='close-modal'){state.modal='';render();return}if(a==='minimize'){document.getElementById('picker').classList.toggle('mini');return}if(a==='reset'){state.active=12;state.focus=1;state.all=!state.phone&&['A','D','E'].includes(state.variant);state.notice=true;state.quick=false;state.filter='';state.status='all';state.modal='';state.split=44;render();return}if(a==='choose'){state.modal=`Elegiste ${state.variant} · ${variants.find(v=>v.id===state.variant).name}`;render();document.querySelector('.mini-modal p').textContent=`Dime en la conversación: “Elijo ${state.variant}”. También puedes combinar la distribución de una opción con los controles de otra. Esta elección no modifica ComandOS.`;return}if(a==='key'){updateState('Tecla '+value+' — no enviada');return}if(a==='start-pomo'){document.querySelector('.timer-value').textContent='24:59';updateState('Pomodoro iniciado — simulación');return}if(a==='sort'){state.modal='Orden de sesiones';render();return}const modals={pomo:'pomo',settings:'Ajustes',account:'Cuenta de Codex',extensions:'MCPs y Skills',new:'Nueva sesión',servers:'Servidores',commands:'Comandos',chains:'Cadenas',panel:'Panel de cuentas'};if(modals[a]){state.modal=modals[a];render()}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;const pos=e.target.selectionStart;state.filter=e.target.value;render();const input=document.querySelector('[data-search]');input?.focus({preventScroll:true});input?.setSelectionRange(pos,pos)});
document.getElementById('session-count').addEventListener('change',e=>{state.count=+e.target.value;state.active=Math.min(state.active,state.count-1);render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.all=false;state.modal='';render()}});
let drag=null;document.addEventListener('pointerdown',e=>{if(e.target.closest('#splitter')){const r=document.querySelector('.panes').getBoundingClientRect();drag={type:'split',x:r.x,width:r.width};e.preventDefault();e.target.setPointerCapture(e.pointerId)}else if(e.target.closest('#drag-picker')){const el=document.getElementById('picker'),r=el.getBoundingClientRect();drag={type:'picker',dx:e.clientX-r.x,dy:e.clientY-r.y};e.target.setPointerCapture(e.pointerId);e.preventDefault()}});document.addEventListener('pointermove',e=>{if(!drag)return;if(drag.type==='split'){state.split=Math.max(25,Math.min(75,(e.clientX-drag.x)/drag.width*100));document.getElementById('app').style.setProperty('--split',state.split+'%');updateState('Split '+Math.round(state.split)+'%')}else{const el=document.getElementById('picker');el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,e.clientX-drag.dx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-el.offsetHeight,e.clientY-drag.dy))+'px';el.style.right='auto';el.style.bottom='auto'}});document.addEventListener('pointerup',()=>drag=null);
state.all=!state.phone&&['A','D','E'].includes(state.variant);render();
</script></body></html>
