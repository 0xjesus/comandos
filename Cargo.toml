[workspace]
members = ["crates/comandos-web-sound", "crates/comandos-web-content", "crates/comandos-oracle", "crates/comandos-app-mac", "crates/comandos-desktop", "crates/comandos-core", "crates/comandos-store", "crates/comandos-runtime", "crates/comandos-extensions", "crates/comandos-server", "crates/comandos-cli", "crates/comandos-acp", "crates/comandos-notifyd", "crates/comandos-browser", "crates/comandos-term", "crates/comandos-domdiff", "crates/comandos-term-web", "crates/comandos-web-view", "crates/comandos-web-dom", "crates/comandos-web", "crates/comandos-web-sw", "xtask", "crates/comandos-app"]
# El gateway vendorizado (cc-model-proxy) tiene su propio Cargo.lock.
exclude = ["vendor/claude-codex"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde_json = { version = "=1.0.150", features = ["arbitrary_precision", "float_roundtrip", "raw_value", "preserve_order"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled"] }
getrandom = { version = "=0.3.4", features = ["std"] }
sha2 = "=0.10.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }

# Keep routine development and verification artifacts compact. Full debug information
# remains available with CARGO_PROFILE_DEV_DEBUG=2 or CARGO_PROFILE_TEST_DEBUG=2.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# WASM de la Fase 3 (`cargo run -p xtask -- web-build`): tamaño ante todo.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

# `alacritty_terminal` vendorizado con el parche wasm (vendor/alacritty_terminal/COMANDOS-PATCH.md).
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
