# tmux para flujo multi-proyecto con Claude Code
# 1 proyecto = 1 sesion (nombre del proyecto). Lanzalas con: ccx <proyecto>

# Comodidad basica
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
source-file -q ~/.claude/hooks/terminal-replies.conf

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# El servidor nace de systemd (tmux.service), no del PTY truecolor de la app:
# sin esto los paneles nuevos no anuncian color completo y Claude/Codex pintan en 256.
set-environment -g COLORTERM truecolor

# El titulo de la pestana del terminal (Tabby/Tilix) muestra el proyecto
set -g set-titles on
set -g set-titles-string "#S"

# Avisos visuales: si otra ventana tiene actividad, se marca en la barra
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=yellow,bold"

# Barra de estado: sesion (proyecto) a la izquierda, hora a la derecha
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bold,fg=colour39] #S #[default] "
set -g status-right-length 120
set -g status-right "#(~/.claude/hooks/cc-status.sh)#[fg=colour245] %H:%M "
setw -g window-status-current-style "fg=colour231,bold"

# Cambio rapido entre sesiones (proyectos):
#   prefix + s  -> lista de sesiones (nativo)
#   prefix + j  -> saltar a la sesion anterior
bind j switch-client -l

# Splits comodos: | vertical, - horizontal, heredando el directorio actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Moverse entre splits con Alt+flechas (sin prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Portapapeles COMPARTIDO. Dos mecanismos a la vez para cubrir todo:
#  1) set-clipboard on: tmux emite OSC52 -> la terminal (VTE/kitty) pone el
#     clipboard del sistema. Funciona INCLUSO en conexiones a servidores.
#  2) xclip: respaldo local.
# Al soltar el mouse se copia y el resaltado queda visible. Si estabas en el fondo,
# el pane vuelve a vivo en 1 s: en copy-mode tmux muestra una foto fija (ni lo nuevo
# de Claude ni el reflujo al mover el split). Leyendo historial, te quedas ahí.
# La primera tecla también saca del copy-mode (lo hace la app).
set -g set-clipboard on
set -ga update-environment " DISPLAY"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard 2>/dev/null" \; if-shell -F "#{==:#{scroll_position},0}" "run-shell -d 1 -C 'if-shell -F -t #{pane_id} \"#{&&:#{pane_in_mode},#{==:#{scroll_position},0}}\" \"send-keys -t #{pane_id} -X cancel\"'"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xclip -in -selection clipboard 2>/dev/null" \; if-shell -F "#{==:#{scroll_position},0}" "run-shell -d 1 -C 'if-shell -F -t #{pane_id} \"#{&&:#{pane_in_mode},#{==:#{scroll_position},0}}\" \"send-keys -t #{pane_id} -X cancel\"'"
bind -T copy-mode    C-c send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null"
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null"
# prefix + ] pega desde el clipboard del sistema
bind ] run "xclip -out -selection clipboard | tmux load-buffer - ; tmux paste-buffer -p"

# Rutas de escape del copy-mode (modo scroll): q o Escape SIEMPRE salen
bind -T copy-mode    Escape send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode    q      send-keys -X cancel
bind -T copy-mode-vi q      send-keys -X cancel
# En copy-mode el pane es una foto fija: no muestra lo nuevo ni se reacomoda al mover
# el split (tmux 3.2a además lo regresa al fondo). Al cambiar el layout, los panes que
# quedaron en el fondo del copy-mode vuelven a vivo.
set -g @comandos-live '#{P:#{?#{&&:#{pane_in_mode},#{==:#{scroll_position},0}},send-keys -t #{pane_id} -X cancel ; ,}}set-option -gq @comandos-live-ran 1'
set-hook -g window-layout-changed 'run-shell -C "#{E:@comandos-live}"'

# ComandOS: modelo de IA por pane en el borde superior. Lee la opcion @ccmodel
# (la escribe cc-dash) con #{E:...} para interpretar sus estilos — SIN spawnear
# un subproceso por pane en cada refresh (con muchos panes eso causa lag).
# Renglon de titulo RESERVADO pero VACIO: es el riel donde la app ComandOS
# flota su pildora por pane (logo + modelo + certeza + boton) SIN tapar
# contenido. El texto viejo del borde se elimino; @ccmodel se sigue
# escribiendo (tooling externo lo usa).
set -g pane-border-status top
set -g pane-border-format ' '
